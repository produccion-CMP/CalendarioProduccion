<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GMP Insumos</title>

  <!-- Meta PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GMP Insumos">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2965/2965567.png">

  <script>
    const manifest = {
      name: "GMP Insumos",
      short_name: "GMP",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#f0f4f8",
      theme_color: "#007bff",
      icons: [{
        src: "https://cdn-icons-png.flaticon.com/512/2965/2965567.png",
        sizes: "512x512",
        type: "image/png"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .app-container {
      width: 100%; max-width: 420px; background: #fff;
      border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden; position: relative;
    }
    .pantalla {
      display: none; padding: 30px 25px; text-align: center;
    }
    .pantalla.activa { display: block; }

    h2 { margin-bottom: 15px; color: #1a3b5d; font-weight: 600; }
    .subtitulo { font-size: 14px; color: #666; margin-bottom: 20px; }

    input, select, button, .btn {
      width: 100%; padding: 12px 15px; margin: 10px 0;
      border: 1px solid #d1d9e0; border-radius: 10px;
      font-size: 16px; transition: 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: #007bff; outline: none; }

    .btn {
      background: #007bff; color: white; font-weight: 600;
      border: none; cursor: pointer; display: inline-block;
    }
    .btn:hover { background: #0056b3; }
    .btn-outline {
      background: white; color: #007bff; border: 2px solid #007bff;
      font-weight: 600;
    }
    .btn-outline:hover { background: #e7f1ff; }
    .btn-success { background: #28a745; }
    .btn-success:hover { background: #1e7e34; }

    .card-grid {
      display: flex; flex-wrap: wrap; gap: 15px; justify-content: center;
      margin: 25px 0;
    }
    .card {
      flex: 1 1 120px; background: #f8fafc; border: 2px solid #e2e8f0;
      border-radius: 16px; padding: 20px 10px; cursor: pointer;
      transition: 0.2s; text-align: center;
    }
    .card:hover, .card.selected { border-color: #007bff; background: #e6f0ff; }
    .card .icono { font-size: 32px; margin-bottom: 8px; }
    .card .label { font-weight: 600; font-size: 14px; }

    .readonly-input { background-color: #e9ecef; }
    .hint { font-size: 13px; color: #dc3545; margin-top: -5px; margin-bottom: 10px; display: block; text-align: left; }

    #scanner-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 1000; display: none; flex-direction: column;
      align-items: center; justify-content: center;
    }
    #video-scanner {
      width: 100%; height: auto; max-height: 80vh;
    }
    .scanner-botones {
      position: absolute; bottom: 30px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 20px;
    }
    .scanner-botones button {
      width: 60px; height: 60px; border-radius: 50%; font-size: 24px;
      border: 2px solid white; background: rgba(255,255,255,0.2); color: white;
    }
    #capturar-btn { background: white; color: black; }

    #cameraError {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: white; padding: 25px;
      border-radius: 15px; text-align: center; width: 90%;
    }
    #cameraError p { margin: 15px 0; }
    #cameraError button { width: auto; padding: 10px 20px; }

    .ocr-campo { background: white; border: 1px solid #ced4da; }
    #scanMensaje { font-weight: bold; margin-top: 10px; }
    #previewScan, #previewFoto {
      max-width: 100%; margin-top: 10px; border-radius: 10px; display: none;
    }
    .flex-row { display: flex; gap: 10px; align-items: center; }
  </style>
</head>
<body>
<div class="app-container">

  <!-- LOGIN -->
  <div id="loginScreen" class="pantalla activa">
    <h2>🔐 Acceso Producción</h2>
    <p class="subtitulo">Ingresá la contraseña para continuar</p>
    <input type="password" id="password" placeholder="Contraseña" autofocus>
    <button class="btn" onclick="verificarLogin()">Ingresar</button>
    <p id="loginError" style="color:red;"></p>
  </div>

  <!-- MENÚ -->
  <div id="menuScreen" class="pantalla">
    <h2>¿Qué deseas hacer?</h2>
    <div class="card-grid">
      <div class="card" onclick="seleccionarMovimiento('Ingreso')">
        <div class="icono">📥</div><div class="label">Ingreso de insumos</div>
      </div>
      <div class="card" onclick="seleccionarMovimiento('Envio')">
        <div class="icono">📤</div><div class="label">Envío de insumos</div>
      </div>
    </div>
  </div>

  <!-- TIPO -->
  <div id="tipoScreen" class="pantalla">
    <h2 id="tipoTitulo"></h2>
    <div class="card-grid">
      <div class="card" onclick="seleccionarTipo('Tarimas')">
        <div class="icono">🟫</div><div class="label">Tarimas</div>
      </div>
      <div class="card" onclick="seleccionarTipo('Stretch')">
        <div class="icono">🌀</div><div class="label">Stretch</div>
      </div>
    </div>
    <button class="btn-outline" onclick="volver('menu')">← Volver</button>
  </div>

  <!-- ESCANEO (NUEVA POSICIÓN: DESPUÉS DE TIPO) -->
  <div id="scanScreen" class="pantalla">
    <h2>📷 Escanear Remito</h2>
    <p class="subtitulo">Tomá una foto del remito o subila de la galería</p>
    <div class="flex-row">
      <button class="btn" onclick="abrirEscaner()">📸 Cámara</button>
      <button class="btn-outline" onclick="document.getElementById('archivoInputScan').click()">📁 Galería</button>
    </div>
    <input type="file" id="archivoInputScan" accept="image/*" capture="environment" style="display:none;" onchange="manejarArchivoScan(this.files[0])">
    <img id="previewScan">
    <button id="btnExtraer" class="btn" style="display:none;" onclick="extraerTextoTesseract()">🔍 Extraer datos</button>
    <div id="ocrResultados" style="display:none; text-align:left; background:#f8f9fa; padding:15px; border-radius:10px; margin-top:15px;">
      <label>Nº Remito:</label><input type="text" id="ocrRemito" class="ocr-campo">
      <label>Fecha:</label><input type="text" id="ocrFecha" class="ocr-campo" placeholder="dd/mm/aaaa">
      <label id="lblCantTarimas" style="display:none;">Cantidad Tarimas:</label><input type="number" id="ocrCantTarimas" class="ocr-campo" style="display:none;">
      <label id="lblKg" style="display:none;">Kg Stretch:</label><input type="number" id="ocrKg" step="0.01" class="ocr-campo" style="display:none;">
      <label id="lblBobinas" style="display:none;">Bobinas:</label><input type="number" id="ocrBobinas" step="0.01" class="ocr-campo" style="display:none;">
      <button id="btnConfirmarScan" class="btn btn-success" style="margin-top:15px; display:none;" onclick="confirmarDatosOCR()">✅ Usar estos datos</button>
    </div>
    <button class="btn-outline" onclick="omitirEscaneo()" style="margin-top:15px;">Saltar escaneo →</button>
    <button class="btn-outline" onclick="volver('tipo')">← Volver</button>
    <div id="scanMensaje"></div>
  </div>

  <!-- PROVEEDOR (solo ingreso, se muestra si no se detectó automático) -->
  <div id="proveedorScreen" class="pantalla">
    <h2>Proveedor</h2>
    <div id="provTarimas" style="display:none;">
      <div class="card-grid">
        <div class="card" onclick="setProveedorTarimas('TucumanChivilisco')">
          <div class="icono">🏭</div><div class="label">Tucumán Pallet / Chivilisco</div>
        </div>
        <div class="card" onclick="setProveedorTarimas('Gianni')">
          <div class="icono">👤</div><div class="label">Gianni</div>
        </div>
        <div class="card" onclick="setProveedorTarimas('Otro')">
          <div class="icono">➕</div><div class="label">Otro</div>
        </div>
      </div>
      <div id="subSelectTarimas" style="display:none; margin-top:15px;">
        <select id="selectTarimas"></select>
      </div>
    </div>
    <div id="provStretch" style="display:none;">
      <div class="card-grid">
        <div class="card" onclick="setProveedorStretch('Urflex')">
          <div class="icono">📦</div><div class="label">Urflex</div>
        </div>
        <div class="card" onclick="setProveedorStretch('Otro')">
          <div class="icono">➕</div><div class="label">Otro</div>
        </div>
      </div>
      <div id="subSelectStretch" style="display:none; margin-top:15px;">
        <select id="selectStretch"></select>
        <div class="flex-row" style="margin-top:10px;">
          <input type="text" id="nuevoProvStretch" placeholder="Nuevo proveedor" style="flex:2;">
          <button class="btn" style="flex:1;" onclick="agregarNuevoStretch()">Agregar</button>
        </div>
      </div>
    </div>
    <button class="btn-outline" onclick="volver('scan')">← Volver</button>
    <button id="btnContinuarProv" class="btn" style="display:none;" onclick="irAFormulario()">Continuar</button>
  </div>

  <!-- FORMULARIO FINAL -->
  <div id="formScreen" class="pantalla">
    <h2 id="formTitulo"></h2>
    <span id="proveedorMostrado" style="font-weight:bold; display:block; margin-bottom:10px;"></span>
    <label>Fecha:</label>
    <input type="date" id="fecha">

    <div id="camposTarimas">
      <label>Cantidad (Tarimas):</label>
      <input type="number" id="cantTarimas" placeholder="Ej: 50" min="1">
    </div>
    <div id="camposStretch" style="display:none;">
      <label>Kg Stretch:</label>
      <input type="number" id="kgStretch" step="0.01" oninput="calcularKgBob()">
      <label>Bobinas:</label>
      <input type="number" id="bobStretch" step="0.01" oninput="calcularKgBob()">
      <label>Kg/Bobina (auto):</label>
      <input type="number" id="kgBob" class="readonly-input" readonly>
    </div>

    <label>Número de Remito:</label>
    <input type="text" id="numRemito" inputmode="numeric" pattern="[0-9]*">
    <span id="remitoHint" class="hint"></span>

    <label>Observaciones:</label>
    <input type="text" id="obs">

    <label>Foto del remito:</label>
    <div class="flex-row">
      <button class="btn-outline" style="flex:1;" onclick="abrirEscaner()">📷 Escanear</button>
      <button class="btn-outline" style="flex:1;" onclick="document.getElementById('archivoInputForm').click()">📁 Galería</button>
    </div>
    <input type="file" id="archivoInputForm" accept="image/*,application/pdf" capture="environment" style="display:none;" onchange="manejarArchivoForm(this.files[0])">
    <img id="previewFoto">

    <button id="btnGuardar" class="btn btn-success" onclick="enviarDatos()">Guardar Movimiento</button>
    <button class="btn-outline" onclick="volver('scan')">← Volver</button>
    <p id="mensaje"></p>
  </div>

</div>

<!-- ESCÁNER -->
<div id="scanner-container">
  <video id="video-scanner" autoplay playsinline></video>
  <div class="scanner-botones">
    <button onclick="cerrarEscaner()">✖️</button>
    <button id="capturar-btn" onclick="capturarFoto()">📸</button>
  </div>
  <div id="cameraError" style="display:none;">
    <p id="cameraErrorMsg"></p>
    <button onclick="reintentarCamara()" class="btn">🔄 Reintentar cámara</button>
    <button onclick="cerrarEscaner()" class="btn-outline" style="margin-top:10px;">Cerrar</button>
  </div>
  <canvas id="scanner-canvas" style="display:none;"></canvas>
</div>

<script src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()" onerror="console.warn('OpenCV no se cargó')"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  // ESTADO GLOBAL
  let movimientoActual = "";  // "Ingreso" o "Envio"
  let tipoActual = "";        // "Tarimas" o "Stretch"
  let proveedorSeleccionado = "";
  let listasProveedores = { tarimas: [], stretch: [] };
  let fotoData = null;
  let openCvReady = false;
  window._scanImageData = null;

  // Pantallas
  const pantallas = {
    login:    document.getElementById('loginScreen'),
    menu:     document.getElementById('menuScreen'),
    tipo:     document.getElementById('tipoScreen'),
    scan:     document.getElementById('scanScreen'),
    proveedor: document.getElementById('proveedorScreen'),
    form:     document.getElementById('formScreen')
  };

  function mostrarPantalla(id) {
    Object.values(pantallas).forEach(p => p.classList.remove('activa'));
    pantallas[id].classList.add('activa');
  }

  function volver(id) {
    mostrarPantalla(id);
  }

  // LOGIN
  document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') verificarLogin();
  });

  function verificarLogin() {
    if (document.getElementById('password').value.trim() === "GMP2026") {
      mostrarPantalla('menu');
      document.getElementById('loginError').innerText = "";
    } else {
      document.getElementById('loginError').innerText = "Contraseña incorrecta";
    }
  }

  // MENÚ
  function seleccionarMovimiento(mov) {
    movimientoActual = mov;
    document.getElementById('tipoTitulo').innerText = mov === "Ingreso" ? "Ingreso de insumos" : "Envío de insumos";
    mostrarPantalla('tipo');
  }

  // TIPO → ahora va a ESCANEO
  function seleccionarTipo(tipo) {
    tipoActual = tipo;
    prepararPantallaScan();
    mostrarPantalla('scan');
  }

  // -------------------- ESCANEO --------------------
  function prepararPantallaScan() {
    document.getElementById('previewScan').style.display = 'none';
    document.getElementById('ocrResultados').style.display = 'none';
    document.getElementById('btnExtraer').style.display = 'none';
    document.getElementById('btnConfirmarScan').style.display = 'none';
    document.getElementById('scanMensaje').innerText = '';
    window._scanImageData = null;

    if (tipoActual === 'Tarimas') {
      document.getElementById('lblCantTarimas').style.display = 'block';
      document.getElementById('ocrCantTarimas').style.display = 'block';
      document.getElementById('lblKg').style.display = 'none';
      document.getElementById('ocrKg').style.display = 'none';
      document.getElementById('lblBobinas').style.display = 'none';
      document.getElementById('ocrBobinas').style.display = 'none';
    } else {
      document.getElementById('lblCantTarimas').style.display = 'none';
      document.getElementById('ocrCantTarimas').style.display = 'none';
      document.getElementById('lblKg').style.display = 'block';
      document.getElementById('ocrKg').style.display = 'block';
      document.getElementById('lblBobinas').style.display = 'block';
      document.getElementById('ocrBobinas').style.display = 'block';
    }
    // limpiar campos
    ['ocrRemito','ocrFecha','ocrCantTarimas','ocrKg','ocrBobinas'].forEach(id => document.getElementById(id).value = '');
  }

  function manejarArchivoScan(archivo) {
    if (!archivo) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('previewScan').src = e.target.result;
      document.getElementById('previewScan').style.display = 'block';
      document.getElementById('btnExtraer').style.display = 'inline-block';
      document.getElementById('ocrResultados').style.display = 'none';
      window._scanImageData = e.target.result;
    };
    reader.readAsDataURL(archivo);
  }

  function dataURLtoFile(dataurl, filename) {
    const arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
          bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
    while(n--) u8arr[n] = bstr.charCodeAt(n);
    return new File([u8arr], filename, {type:mime});
  }

  function imagenListaParaOCR(dataURL) {
    manejarArchivoScan(dataURLtoFile(dataURL, "remito_escaneado.jpg"));
  }

  async function extraerTextoTesseract() {
    const img = document.getElementById('previewScan');
    if (!img.src) return;
    document.getElementById('scanMensaje').innerText = 'Procesando OCR...';
    document.getElementById('btnExtraer').disabled = true;
    try {
      const { data: { text } } = await Tesseract.recognize(img, 'spa', { logger: m => console.log(m) });
      console.log('OCR:', text);
      const datos = parsearTextoRemito(text);
      document.getElementById('ocrRemito').value = datos.remito || '';
      document.getElementById('ocrFecha').value = datos.fecha || '';
      if (tipoActual === 'Tarimas') {
        document.getElementById('ocrCantTarimas').value = datos.cantTarimas || '';
      } else {
        document.getElementById('ocrKg').value = datos.kg || '';
        document.getElementById('ocrBobinas').value = datos.bobinas || '';
      }
      document.getElementById('ocrResultados').style.display = 'block';
      document.getElementById('btnConfirmarScan').style.display = 'inline-block';
      document.getElementById('scanMensaje').innerText = 'Verificá los datos.';
    } catch (err) {
      document.getElementById('scanMensaje').innerText = 'Error al leer. Intentá con otra imagen.';
    } finally {
      document.getElementById('btnExtraer').disabled = false;
    }
  }

  function parsearTextoRemito(texto) {
    const t = texto.toLowerCase().replace(/\n/g, ' ').replace(/\s+/g, ' ');
    const res = {};
    const remitoMatch = t.match(/remito\s*(n°|nro|no|número|num)?\s*[:#]?\s*(\d{1,10})/i);
    if (remitoMatch) res.remito = remitoMatch[2];
    else {
      const soloNum = t.match(/\b(\d{5,10})\b/);
      if (soloNum) res.remito = soloNum[1];
    }
    const fechaMatch = t.match(/(\d{1,2}[/-]\d{1,2}[/-]\d{2,4})/);
    if (fechaMatch) res.fecha = fechaMatch[1].replace(/-/g, '/');
    const tarimasMatch = t.match(/(\d+)\s*(tarimas|pallets|pallet)/i);
    if (tarimasMatch) res.cantTarimas = tarimasMatch[1];
    const kgMatch = t.match(/(\d+[\.,]?\d*)\s*(kg|kilos)/i);
    if (kgMatch) res.kg = kgMatch[1].replace(',', '.');
    const bobMatch = t.match(/(\d+)\s*(bobinas|bob\.?)/i);
    if (bobMatch) res.bobinas = bobMatch[1];
    return res;
  }

  // Confirmar OCR: precargar formulario e intentar auto‑proveedor
  function confirmarDatosOCR() {
    // Pasar datos al formulario
    document.getElementById('numRemito').value = document.getElementById('ocrRemito').value.trim();
    const fechaStr = document.getElementById('ocrFecha').value.trim();
    if (fechaStr) {
      const partes = fechaStr.split(/[/-]/);
      if (partes.length === 3) {
        let [d, m, y] = partes;
        if (y.length === 2) y = '20' + y;
        const f = new Date(`${y}-${m}-${d}`);
        if (!isNaN(f)) document.getElementById('fecha').valueAsDate = f;
      }
    }
    if (tipoActual === 'Tarimas') {
      document.getElementById('cantTarimas').value = document.getElementById('ocrCantTarimas').value;
    } else {
      document.getElementById('kgStretch').value = document.getElementById('ocrKg').value;
      document.getElementById('bobStretch').value = document.getElementById('ocrBobinas').value;
      calcularKgBob();
    }
    if (window._scanImageData) {
      fotoData = { dataURL: window._scanImageData, nombre: 'remito_escaneado.jpg', mime: 'image/jpeg' };
      document.getElementById('previewFoto').src = window._scanImageData;
      document.getElementById('previewFoto').style.display = 'block';
    }

    // Intentar detectar proveedor en el texto extraído
    const textoCompleto = document.getElementById('ocrRemito').value + ' ' +
                          document.getElementById('ocrFecha').value + ' ' +
                          (tipoActual==='Tarimas' ? document.getElementById('ocrCantTarimas').value : 
                           document.getElementById('ocrKg').value + ' ' + document.getElementById('ocrBobinas').value);
    const provDetectado = detectarProveedor(textoCompleto.toLowerCase());
    if (movimientoActual === 'Envio') {
      proveedorSeleccionado = 'Envío';
      irAFormularioDirecto();
    } else if (provDetectado) {
      proveedorSeleccionado = provDetectado;
      irAFormularioDirecto();
    } else {
      // No se detectó proveedor → ir a pantalla de selección manual
      prepararPantallaProveedor();
      mostrarPantalla('proveedor');
    }
  }

  function detectarProveedor(texto) {
    const lista = tipoActual === 'Tarimas' ? listasProveedores.tarimas : listasProveedores.stretch;
    for (let prov of lista) {
      if (texto.includes(prov.toLowerCase())) return prov;
    }
    return null;
  }

  function omitirEscaneo() {
    // Saltar escaneo → ir a proveedor (si es ingreso) o directo a formulario si es envío
    if (movimientoActual === 'Envio') {
      proveedorSeleccionado = 'Envío';
      irAFormularioDirecto();
    } else {
      prepararPantallaProveedor();
      mostrarPantalla('proveedor');
    }
  }

  // -------------------- PROVEEDOR --------------------
  function prepararPantallaProveedor() {
    document.getElementById('subSelectTarimas').style.display = 'none';
    document.getElementById('subSelectStretch').style.display = 'none';
    document.getElementById('btnContinuarProv').style.display = 'none';

    document.getElementById('provTarimas').style.display = (tipoActual === 'Tarimas') ? 'block' : 'none';
    document.getElementById('provStretch').style.display = (tipoActual === 'Stretch') ? 'block' : 'none';

    // Resetear selección
    proveedorSeleccionado = '';
  }

  window.setProveedorTarimas = function(opcion) {
    document.getElementById('subSelectTarimas').style.display = 'none';
    document.getElementById('btnContinuarProv').style.display = 'inline-block';
    if (opcion === 'Gianni') {
      proveedorSeleccionado = 'Gianni';
    } else if (opcion === 'TucumanChivilisco') {
      llenarSelectTarimasTucuman();
      document.getElementById('subSelectTarimas').style.display = 'block';
      proveedorSeleccionado = document.getElementById('selectTarimas').value;
    } else if (opcion === 'Otro') {
      llenarSelectTarimasOtros();
      document.getElementById('subSelectTarimas').style.display = 'block';
      proveedorSeleccionado = document.getElementById('selectTarimas').value;
    }
  };

  document.addEventListener('change', e => {
    if (e.target.id === 'selectTarimas') proveedorSeleccionado = e.target.value;
    if (e.target.id === 'selectStretch') proveedorSeleccionado = e.target.value;
  });

  function llenarSelectTarimasTucuman() {
    const select = document.getElementById('selectTarimas');
    select.innerHTML = "";
    listasProveedores.tarimas.filter(p => p === "Tucumán Pallet" || p === "Chivilisco")
      .forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
  }

  function llenarSelectTarimasOtros() {
    const select = document.getElementById('selectTarimas');
    select.innerHTML = "";
    listasProveedores.tarimas.filter(p => !["Envío", "Tucumán Pallet", "Chivilisco", "Gianni"].includes(p))
      .forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
  }

  window.setProveedorStretch = function(opcion) {
    document.getElementById('subSelectStretch').style.display = 'none';
    document.getElementById('btnContinuarProv').style.display = 'inline-block';
    if (opcion === 'Urflex') {
      proveedorSeleccionado = 'Urflex';
    } else if (opcion === 'Otro') {
      llenarSelectStretchOtros();
      document.getElementById('subSelectStretch').style.display = 'block';
      proveedorSeleccionado = document.getElementById('selectStretch').value;
    }
  };

  function llenarSelectStretchOtros() {
    const select = document.getElementById('selectStretch');
    select.innerHTML = "";
    listasProveedores.stretch.filter(p => !["Envío", "Urflex"].includes(p))
      .forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
  }

  async function agregarNuevoStretch() {
    const nombre = document.getElementById('nuevoProvStretch').value.trim();
    if (!nombre) return alert("Ingresá un nombre");
    const resp = await google.script.run.withSuccessHandler(r => {
      if (r.exito) {
        listasProveedores.stretch.push(nombre);
        llenarSelectStretchOtros();
        document.getElementById('nuevoProvStretch').value = "";
      }
    }).agregarProveedorStretch(nombre);
  }

  function irAFormulario() {
    prepararFormularioVisual();
    mostrarPantalla('form');
  }

  function irAFormularioDirecto() {
    prepararFormularioVisual();
    mostrarPantalla('form');
  }

  // -------------------- FORMULARIO --------------------
  function prepararFormularioVisual() {
    document.getElementById('formTitulo').innerText = movimientoActual + ' de ' + tipoActual;
    document.getElementById('proveedorMostrado').innerText = 'Proveedor: ' + proveedorSeleccionado;
    if (tipoActual === 'Tarimas') {
      document.getElementById('camposTarimas').style.display = 'block';
      document.getElementById('camposStretch').style.display = 'none';
    } else {
      document.getElementById('camposTarimas').style.display = 'none';
      document.getElementById('camposStretch').style.display = 'block';
    }
    actualizarValidacionRemito();
  }

  function actualizarValidacionRemito() {
    const hint = document.getElementById('remitoHint');
    if (tipoActual === 'Tarimas' && movimientoActual === 'Ingreso') {
      if (proveedorSeleccionado === 'Gianni') hint.innerText = '* Gianni: exactamente 6 dígitos.';
      else if (proveedorSeleccionado === 'Tucumán Pallet' || proveedorSeleccionado === 'Chivilisco') hint.innerText = '* ' + proveedorSeleccionado + ': entre 1 y 4 dígitos.';
      else hint.innerText = '';
    } else hint.innerText = '';
  }

  function calcularKgBob() {
    const kg = parseFloat(document.getElementById('kgStretch').value) || 0;
    const bob = parseFloat(document.getElementById('bobStretch').value) || 0;
    document.getElementById('kgBob').value = bob > 0 ? (kg / bob).toFixed(2) : '';
  }

  function manejarArchivoForm(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      fotoData = { dataURL: e.target.result, nombre: file.name, mime: file.type };
      document.getElementById('previewFoto').src = e.target.result;
      document.getElementById('previewFoto').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  // -------------------- CÁMARA (con ayuda de permisos) --------------------
  let scannerStream = null;
  function onOpenCvReady() { openCvReady = true; }

  async function abrirEscaner() {
    document.getElementById('cameraError').style.display = 'none';
    if (!navigator.mediaDevices?.getUserMedia) {
      mostrarErrorCamara("Tu navegador no soporta cámara. Usá Galería.");
      return;
    }
    document.getElementById('scanner-container').style.display = 'flex';
    const video = document.getElementById('video-scanner');
    try {
      scannerStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = scannerStream;
    } catch (err) {
      cerrarEscaner();
      let mensaje = "";
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        mensaje = "Permiso de cámara denegado.\n\n🔧 En Android: Ajustes > Aplicaciones > Chrome > Permisos > Cámara.\n🔧 En iPhone: Ajustes > Safari > Cámara.\nLuego volvé a intentar.";
      } else if (err.name === 'NotFoundError') {
        mensaje = "No se encontró cámara en el dispositivo.";
      } else {
        mensaje = "Error: " + err.message;
      }
      mostrarErrorCamara(mensaje);
    }
  }

  function mostrarErrorCamara(mensaje) {
    document.getElementById('cameraErrorMsg').innerText = mensaje;
    document.getElementById('cameraError').style.display = 'block';
  }

  function reintentarCamara() {
    document.getElementById('cameraError').style.display = 'none';
    cerrarEscaner();
    abrirEscaner(); // vuelve a pedir permiso
  }

  function cerrarEscaner() {
    if (scannerStream) {
      scannerStream.getTracks().forEach(t => t.stop());
      scannerStream = null;
    }
    document.getElementById('scanner-container').style.display = 'none';
    document.getElementById('cameraError').style.display = 'none';
  }

  function capturarFoto() {
    if (!openCvReady) { alert("Cargando escáner..."); return; }
    const video = document.getElementById('video-scanner');
    const canvas = document.getElementById('scanner-canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    procesarImagen(canvas);
  }

  function procesarImagen(canvas) {
    try {
      const src = cv.imread(canvas);
      const gray = new cv.Mat(); cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      const blur = new cv.Mat(); cv.GaussianBlur(gray, blur, { width: 5, height: 5 }, 0);
      const edges = new cv.Mat(); cv.Canny(blur, edges, 75, 200);
      const contours = new cv.MatVector(), hierarchy = new cv.Mat();
      cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      let maxArea = 0, maxContour = null;
      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);
        if (area > maxArea && area > 5000) { maxArea = area; maxContour = cnt; }
      }
      if (maxContour) {
        const approx = new cv.Mat();
        cv.approxPolyDP(maxContour, approx, 0.02 * cv.arcLength(maxContour, true), true);
        if (approx.rows === 4) {
          const pts = [];
          for (let i = 0; i < 4; i++) pts.push({ x: approx.data32S[i*2], y: approx.data32S[i*2+1] });
          const sorted = ordenarPuntos(pts);
          const width = Math.max(Math.hypot(sorted[1].x-sorted[0].x, sorted[1].y-sorted[0].y),
                                Math.hypot(sorted[2].x-sorted[3].x, sorted[2].y-sorted[3].y));
          const height = Math.max(Math.hypot(sorted[3].x-sorted[0].x, sorted[3].y-sorted[0].y),
                                 Math.hypot(sorted[2].x-sorted[1].x, sorted[2].y-sorted[1].y));
          const dstPts = cv.matFromArray(4, 1, cv.CV_32FC2, [0,0, width-1,0, width-1,height-1, 0,height-1]);
          const srcPts = cv.matFromArray(4, 1, cv.CV_32FC2, sorted.map(p => [p.x, p.y]).flat());
          const M = cv.getPerspectiveTransform(srcPts, dstPts);
          const warped = new cv.Mat();
          cv.warpPerspective(src, warped, M, { width: Math.floor(width), height: Math.floor(height) });
          cv.imshow('scanner-canvas', warped);
          const dataURL = document.getElementById('scanner-canvas').toDataURL('image/jpeg', 0.9);
          cerrarEscaner();
          (pantallas.scan.classList.contains('activa') ? imagenListaParaOCR : dataURL => manejarArchivoForm(dataURLtoFile(dataURL,'foto.jpg')))(dataURL);
          [src,gray,blur,edges,contours,hierarchy,approx,M,warped,dstPts,srcPts].forEach(m => m.delete());
          return;
        }
        approx.delete();
      }
      // fallback
      const dataURL = canvas.toDataURL('image/jpeg', 0.9);
      cerrarEscaner();
      (pantallas.scan.classList.contains('activa') ? imagenListaParaOCR : dataURL => manejarArchivoForm(dataURLtoFile(dataURL,'foto.jpg')))(dataURL);
      [src,gray,blur,edges,contours,hierarchy].forEach(m => m.delete());
    } catch(e) {
      console.error(e);
      const dataURL = canvas.toDataURL('image/jpeg', 0.9);
      cerrarEscaner();
      (pantallas.scan.classList.contains('activa') ? imagenListaParaOCR : dataURL => manejarArchivoForm(dataURLtoFile(dataURL,'foto.jpg')))(dataURL);
    }
  }

  function ordenarPuntos(points) {
    const c = points.reduce((acc, p) => ({ x: acc.x + p.x/4, y: acc.y + p.y/4 }), {x:0, y:0});
    return points.sort((a,b) => Math.atan2(a.y-c.y, a.x-c.x) - Math.atan2(b.y-c.y, b.x-c.x));
  }

  // -------------------- GUARDAR --------------------
  async function enviarDatos() {
    const numRemito = document.getElementById('numRemito').value.trim();
    if (!numRemito) return alert("Ingresá el número de remito.");
    if (movimientoActual === 'Ingreso' && tipoActual === 'Tarimas') {
      if (proveedorSeleccionado === 'Gianni' && !/^\d{6}$/.test(numRemito)) return alert("Remito Gianni: 6 dígitos.");
      if ((proveedorSeleccionado === 'Tucumán Pallet' || proveedorSeleccionado === 'Chivilisco') && !/^\d{1,4}$/.test(numRemito))
        return alert("Remito " + proveedorSeleccionado + ": 1-4 dígitos.");
    }
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true; btn.innerText = "Guardando...";
    const datos = {
      password: document.getElementById('password').value,
      movimiento: movimientoActual,
      tipo: tipoActual,
      proveedor: proveedorSeleccionado,
      fecha: document.getElementById('fecha').value,
      numRemito, cantTarimas: document.getElementById('cantTarimas').value || 0,
      kgStretch: document.getElementById('kgStretch').value || 0,
      bobStretch: document.getElementById('bobStretch').value || 0,
      kgBob: document.getElementById('kgBob').value || 0,
      obs: document.getElementById('obs').value,
    };
    if (fotoData) Object.assign(datos, { archivoData: fotoData.dataURL, archivoNombre: fotoData.nombre, archivoMime: fotoData.mime });
    google.script.run.withSuccessHandler(resp => {
      document.getElementById('mensaje').style.color = resp.exito ? 'green' : 'red';
      document.getElementById('mensaje').innerText = resp.mensaje;
      if (resp.exito) setTimeout(() => location.reload(), 2000);
      else { btn.disabled = false; btn.innerText = "Guardar Movimiento"; }
    }).procesarCarga(datos);
  }

  window.onload = () => google.script.run.withSuccessHandler(l => listasProveedores = l).getProveedores();
</script>
