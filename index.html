<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cronograma de Producción – Cerámica Marcos Paz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    /* ========== Variables y estilos base (idénticos a la última versión) ========== */
    :root {
      --bg-body: #0f0f0f;
      --bg-panel: #1c1c1e;
      --bg-cell: #2c2c2e;
      --border: #3a3a3c;
      --text-main: #f5f5f7;
      --text-muted: #98989d;
      --accent: #e07b4c;
      --accent-light: #f0a880;
      --green: #30d158;
      --orange: #ff9f0a;
      --red: #ff453a;
      --gray: #636366;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-3d: 0 4px 12px rgba(0,0,0,0.4);
      --radius: 14px;
      --cell-h: 68px;
      --font: 'Plus Jakarta Sans', system-ui, sans-serif;
      --prueba-bg: rgba(255,215,0,0.2);
      --sunday-bg: rgba(255,255,255,0.03);
    }

    body.light-mode {
      --bg-body: #f2f2f7;
      --bg-panel: #ffffff;
      --bg-cell: #fafafa;
      --border: #e5e5ea;
      --text-main: #1c1c1e;
      --text-muted: #6e6e73;
      --accent: #d96b3a;
      --accent-light: #c45a2c;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-3d: 0 4px 16px rgba(0,0,0,0.12);
      --prueba-bg: rgba(255,215,0,0.15);
      --sunday-bg: rgba(0,0,0,0.02);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg-body);
      color: var(--text-main);
      padding: 24px;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* ... (resto de estilos sin cambios: header, botones, toggle, kpi, tabla, etc.) ... */
    /* Se mantienen todos los estilos previos, incluyendo .sunday-cell y eliminando .turn-label::after */
    /* Asegúrate de copiar los estilos completos desde la última versión, eliminando la regla .turn-label::after */
    .turn-label {
      font-weight: 700; color: var(--accent-light); font-size: 0.85rem;
      writing-mode: vertical-rl; text-orientation: mixed; margin: auto;
      /* sin ::after */
    }

    /* ... resto de estilos ... */
  </style>
</head>
<body>
  <!-- Estructura HTML idéntica a la última versión (header, views, kpi, tabla, modal, etc.) -->

  <script>
    // ==================== CONFIGURACIÓN ====================
    const CSV_PLAN = '...'; // misma URL
    const CSV_REAL = '...';
    const IMG_PATH = 'img/moldes/';
    const FALLBACK_IMG = 'img/moldes/default.png';
    const TURNOS = ['T1','T2','T3'];

    let planData = {};
    let realTasksByTurno = {};   // { clave: { productions: [...], tests: [...] } }
    let currentView = 'prod';
    let currentDate = new Date();
    let themeDark = true;

    // Colores...
    // (funciones sin cambios)

    // ==================== CARGA DE DATOS (CORREGIDA) ====================
    async function loadData() {
      const [planRows, realRows] = await Promise.all([fetchCSV(CSV_PLAN), fetchCSV(CSV_REAL)]);

      // Planificación (sin cambios)
      planData = {};
      planRows.forEach(row => {
        // mismo procesamiento
      });

      // Procesar producción real
      const allReal = [];
      realRows.forEach(row => {
        const dia = row['Día']?.trim(), turno = row['Turno']?.trim(), molde = row['Molde']?.trim();
        if (!dia || !turno || !molde) return;
        const p = dia.split('/'); if (p.length !== 3) return;
        const fecha = new Date(p[2], p[1] - 1, p[0]);
        allReal.push({ date: fecha, turno, moldeCompleto: molde, baseName: getBaseName(molde), number: getMoldNumber(molde) });
      });
      allReal.sort((a, b) => a.date - b.date || TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno));

      // Agrupar por clave
      const grouped = new Map();
      allReal.forEach(r => {
        const k = key(formatYYYYMMDD(r.date), r.turno);
        if (!grouped.has(k)) grouped.set(k, []);
        grouped.get(k).push(r);
      });

      // Orden cronológico de claves
      const entries = [];
      for (const [clave, regs] of grouped.entries()) {
        const [fechaStr, turno] = clave.split('_');
        entries.push({ clave, fecha: new Date(fechaStr + 'T00:00:00'), turno, regs });
      }
      entries.sort((a, b) => a.fecha - b.fecha || TURNOS.indexOf(a.turno) - TURNOS.indexOf(b.turno));

      realTasksByTurno = {};
      for (let i = 0; i < entries.length; i++) {
        const entry = entries[i];
        const prevEntry = i > 0 ? entries[i - 1] : null;
        const nextEntry = i < entries.length - 1 ? entries[i + 1] : null;

        const prevMolds = prevEntry ? prevEntry.regs.map(r => r.moldeCompleto) : [];
        const nextMolds = nextEntry ? nextEntry.regs.map(r => r.moldeCompleto) : [];

        const productions = [];
        const tests = [];

        entry.regs.forEach(r => {
          let score = 0;
          if (prevMolds.includes(r.moldeCompleto)) score += 1;
          if (nextMolds.includes(r.moldeCompleto)) score += 1;

          if (score >= 1) {
            // Es producción
            const isContinuation = prevMolds.includes(r.moldeCompleto);
            productions.push({
              ...r,
              isContinuation,
            });
          } else {
            // Es prueba
            tests.push({ ...r, isTest: true });
          }
        });

        realTasksByTurno[entry.clave] = { productions, tests };
      }

      renderGantt();
    }

    // ==================== RENDER GANTT (adaptado) ====================
    function renderGantt() {
      const wrapper = document.getElementById('ganttWrapper');
      const year = currentDate.getFullYear(), month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatYYYYMMDD(new Date());

      document.getElementById('monthTitle').textContent =
        currentDate.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }).toUpperCase();

      if (currentView === 'cumpl') actualizarKPIs();
      document.getElementById('kpiContainer').style.display = currentView === 'cumpl' ? 'flex' : 'none';

      const turnoWidth = 65;
      const colWidthCalc = `calc((100% - ${turnoWidth}px) / ${daysInMonth})`;

      let html = `<table class="gantt-table"><thead><tr><th style="width:${turnoWidth}px;"></th>`;
      const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        const dayName = dayNames[date.getDay()];
        const isSunday = date.getDay() === 0;
        const isToday = formatYYYYMMDD(date) === todayStr;
        html += `<th style="width:${colWidthCalc};" class="${isToday ? 'today-cell' : ''} ${isSunday ? 'sunday-cell' : ''}">
          <div class="day-header"><span class="day-name">${dayName}</span><span class="day-number">${d}</span></div>
        </th>`;
      }
      html += '</tr></thead><tbody>';

      // Para seguimiento de continuidad
      let lastRealMolds = new Map(); // clave turno -> último molde activo para cada turno (para detectar cambios)
      let lastPlanMold = null;

      TURNOS.forEach(turno => {
        html += `<tr><td class="turn-label" style="width:${turnoWidth}px;">${turno}</td>`;
        let currentPlanMold = null;

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const dateObj = new Date(year, month, d);
          const isSunday = dateObj.getDay() === 0;
          const k = key(dateStr, turno);
          const plans = planData[k] || [];
          const realInfo = realTasksByTurno[k];

          let cellContent = '';
          let bgColor = 'transparent';
          let txtColor = 'inherit';

          if (currentView === 'prod' && realInfo) {
            const { productions, tests } = realInfo;
            // Dibujar producciones
            productions.forEach((prod, idx) => {
              const color = getBrickColor(prod.baseName, prod.number);
              const textColor = pickTextColor(color);
              const isNew = !prod.isContinuation;
              // Determinar si mostramos detalle o solo color
              const showDetail = isNew; // mostrar detalle solo en el primer turno del segmento
              if (showDetail) {
                cellContent += `<div style="background-color:${color}; color:${textColor};" class="turn-task">
                  ${createMoldHTML(prod.baseName, prod.number)}
                  ${lastRealMolds.has(turno) && lastRealMolds.get(turno) !== prod.moldeCompleto ? '<div class="change-emoji">🔄️</div>' : ''}
                </div>`;
                lastRealMolds.set(turno, prod.moldeCompleto);
              } else {
                cellContent += `<div style="background-color:${color};" class="continuation-bar"></div>`;
              }
              // Mantener el último molde activo para este turno
              lastRealMolds.set(turno, prod.moldeCompleto);
            });
            // Pruebas
            tests.forEach(test => {
              cellContent += `<div class="prueba-badge">PR ${test.baseName} ${test.number}</div>`;
            });
          } else if (currentView === 'plan' && plans.length > 0) {
            // (lógica de plan igual que antes, usando lastPlanMold)
            // ... código similar ...
          } else if (currentView === 'cumpl' && realInfo) {
            // Similar a prod pero agregando barra de cumplimiento
            // ...
          }

          if (cellContent === '' && bgColor === 'transparent') {
            cellContent = '<span style="color:var(--text-muted);">—</span>';
          }

          html += `<td style="background-color:${bgColor}; color:${txtColor}; width:${colWidthCalc};" 
                       class="${isSunday ? 'sunday-cell' : ''}"
                       onclick="abrirGantt('${dateStr}')">${cellContent}</td>`;
        }
        html += '</tr>';
      });

      html += '</tbody></table>';
      wrapper.innerHTML = html;
      renderPruebasInfo();
    }

    // ... (resto de funciones sin cambios: KPIs, pruebas info, vistas, Gantt diario, navegación, etc.)
  </script>
</body>
</html>
