<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planificación de Producción – Cerámica Marcos Paz</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-body: #1a1814;
      --bg-panel: #25221d;
      --bg-cell: #2f2a24;
      --border: #4a4238;
      --text-main: #f0e6d8;
      --text-muted: #b8a99a;
      --accent: #d97736;
      --accent-light: #e8a87c;
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
      --radius: 12px;
      --cell-height: 130px;
      --prueba-bg: hsla(45, 80%, 90%, 0.25);
      --prueba-border: #f1c40f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 25px;
      padding: 15px 20px;
      background: var(--bg-panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background-image: url('img/deco/header-bg.png');
      background-size: cover;
      background-position: center;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-container img {
      height: 55px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .title-block h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-light);
      text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    }
    .title-block small {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .live-clock {
      background: rgba(0,0,0,0.3);
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      backdrop-filter: blur(5px);
    }
    .btn-add, .btn-print {
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: var(--shadow);
      border: none;
      color: #fff;
    }
    .btn-add { background: var(--accent); }
    .btn-add:hover { background: #c85d2a; }
    .btn-print { background: #4a4238; }
    .btn-print:hover { background: #5e5548; }

    .month-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }
    .month-nav button {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .month-nav button:hover { background: var(--accent); border-color: var(--accent); }
    .month-label {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-light);
    }

    .calendar-wrapper {
      background: var(--bg-panel);
      border-radius: var(--radius);
      padding: 15px;
      box-shadow: var(--shadow);
    }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .weekdays div {
      padding: 8px 0;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-cell {
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      min-height: var(--cell-height);
      overflow: hidden;
      transition: 0.15s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .day-cell:hover { border-color: var(--accent); background: #36312a; }
    .day-number {
      font-weight: 800;
      font-size: 0.9rem;
      padding: 6px 8px 2px;
      color: var(--text-main);
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .turns-container {
      display: flex;
      flex: 1;
      flex-direction: row;
    }
    .turn-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 2px;
      border-right: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 0.7rem;
      overflow-y: auto;
      max-height: 100%;
    }
    .turn-column:last-child { border-right: none; }
    .turn-label {
      font-weight: 700;
      color: var(--accent-light);
      font-size: 0.6rem;
      margin-bottom: 3px;
      text-transform: uppercase;
    }
    .empty-turn {
      color: var(--text-muted);
      font-size: 0.65rem;
      margin-top: 8px;
    }

    /* Tarea genérica */
    .turn-task {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 4px;
      padding: 3px 2px;
      border-radius: 4px;
      width: 100%;
      background: rgba(0,0,0,0.15);
      position: relative;
    }
    .mold-image {
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 4px;
      margin-bottom: 2px;
      background: rgba(255,255,255,0.05);
      padding: 2px;
    }
    .mold-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color: var(--text-main);
    }
    .change-emoji {
      font-size: 1.2rem;
      margin-bottom: 2px;
    }

    /* Prueba: estilo amarillento suave */
    .turn-task.prueba {
      background: var(--prueba-bg);
      border: 1px solid var(--prueba-border);
    }
    .prueba-label {
      font-size: 0.5rem;
      background: #f1c40f;
      color: #000;
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 700;
      margin-top: 1px;
      line-height: 1.2;
    }

    .more-tasks {
      font-size: 0.6rem;
      color: var(--accent-light);
      font-weight: 700;
      margin-top: 2px;
    }

    .legend {
      margin-top: 30px;
      background: var(--bg-panel);
      border-radius: var(--radius);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      box-shadow: var(--shadow);
      font-size: 0.8rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 14px; height: 14px; border-radius: 4px;
    }
    .legend-img {
      width: 25px;
      height: 25px;
      object-fit: contain;
    }

    @media print {
      body { background: white !important; color: black !important; padding: 0; }
      .app-header, .month-nav button, .btn-add, .btn-print, .live-clock, .legend { display: none !important; }
      .app-header { background: none !important; box-shadow: none; padding: 0; }
      .calendar-wrapper { box-shadow: none; background: none; padding: 0; }
      .day-cell { background: #f9f9f9; border: 1px solid #aaa; box-shadow: none; }
      .turn-column { background: none; }
      .turn-label { color: black; }
      .mold-image { filter: none; }
      .mold-name { color: black; }
      .prueba-label { background: #f1c40f; }
      .month-label { color: black; }
      .days-grid { gap: 2px; }
      @page { size: A4 landscape; margin: 1cm; }
    }

    @media (max-width: 640px) {
      .day-cell { min-height: 100px; }
      .mold-image { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="logo-container">
      <img src="img/logo.png" alt="Cerámica Marcos Paz">
      <div class="title-block">
        <h1>Producción Ladrillos Cerámicos</h1>
        <small>Tucumán, Argentina — Planta CEVIL</small>
      </div>
    </div>
    <div class="header-actions">
      <div class="live-clock" id="liveClock"></div>
      <a href="admin.html" class="btn-add">🧱 + Nuevo Plan</a>
      <button class="btn-print" onclick="window.print()">🖨️ Imprimir Mes</button>
    </div>
  </header>

  <div class="month-nav">
    <button onclick="cambiarMes(-1)">◀ Anterior</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="cambiarMes(1)">Siguiente ▶</button>
  </div>

  <div class="calendar-wrapper">
    <div class="weekdays">
      <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--accent);"></div> Turno con plan</div>
    <div class="legend-item"><span style="font-weight:700; background:#f1c40f; color:#000; padding:0 4px; border-radius:3px;">PR</span> Prueba</div>
    <div class="legend-item"><span style="font-size:1.2rem;">🔄️</span> Cambio de molde</div>
    <div class="legend-item"><img src="img/moldes/H12.png" class="legend-img" onerror="this.style.display='none'"> Imagen referencial</div>
    <div class="legend-item"><span style="color:var(--text-muted);">—</span> Sin planificar</div>
  </div>

  <script>
    const CSV_PLAN = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=304716517&single=true&output=csv';
    const IMG_PATH = 'img/moldes/';
    const FALLBACK_IMG = 'img/moldes/default.png';

    let planData = {};
    let currentDate = new Date();

    async function fetchCSV(url) {
      const resp = await fetch(url);
      const text = await resp.text();
      return new Promise(resolve => {
        Papa.parse(text, { header: true, skipEmptyLines: true, complete: r => resolve(r.data) });
      });
    }

    function formatYYYYMMDD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth()+1).padStart(2,'0');
      const d = String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }

    function key(fecha, turno) { return `${fecha}_${turno}`; }

    function getBaseName(moldeCompleto) {
      return moldeCompleto.split(' (')[0].trim();
    }

    function getImageSrc(baseName) {
      return `${IMG_PATH}${baseName}.png`;
    }

    async function loadData() {
      try {
        const planRows = await fetchCSV(CSV_PLAN);
        console.log('📊 Filas obtenidas:', planRows.length);
        planData = {};

        planRows.forEach(row => {
          const molde = row['MOLDE']?.trim();
          const tarea = row['TAREA']?.trim();
          const fi = row['FECHA INICIO']?.trim();
          const ti = row['TURNO INICIO']?.trim();
          const ff = row['FECHA FIN']?.trim();
          const tf = row['TURNO FIN']?.trim();
          if (!molde || !fi || !ff) return;

          const inicio = new Date(fi + 'T00:00:00');
          const fin = new Date(ff + 'T00:00:00');
          if (isNaN(inicio.getTime()) || isNaN(fin.getTime())) return;

          const turnos = ['T1','T2','T3'];
          for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate()+1)) {
            const dayStr = formatYYYYMMDD(d);
            let turnosDia = [];
            if (d.getTime() === inicio.getTime() && d.getTime() === fin.getTime()) {
              const idx1 = turnos.indexOf(ti), idx2 = turnos.indexOf(tf);
              for (let i = idx1; i <= idx2; i++) turnosDia.push(turnos[i]);
            } else if (d.getTime() === inicio.getTime()) {
              const idx1 = turnos.indexOf(ti);
              for (let i = idx1; i < 3; i++) turnosDia.push(turnos[i]);
            } else if (d.getTime() === fin.getTime()) {
              const idx2 = turnos.indexOf(tf);
              for (let i = 0; i <= idx2; i++) turnosDia.push(turnos[i]);
            } else {
              turnosDia = ['T1','T2','T3'];
            }
            turnosDia.forEach(t => {
              const k = key(dayStr, t);
              if (!planData[k]) planData[k] = [];
              planData[k].push({
                moldeCompleto: molde,
                baseName: getBaseName(molde),
                tarea,
                esInicio: d.getTime() === inicio.getTime(),
                esFin: d.getTime() === fin.getTime()
              });
            });
          }
        });
        console.log('✅ Planificaciones procesadas:', Object.keys(planData).length);
        renderCalendar();
      } catch (error) {
        console.error('❌ Error cargando datos:', error);
      }
    }

    function renderCalendar() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();

      document.getElementById('monthLabel').textContent = 
        currentDate.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }).toUpperCase();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.style.visibility = 'hidden';
        grid.appendChild(emptyCell);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const numDiv = document.createElement('div');
        numDiv.className = 'day-number';
        numDiv.textContent = d;
        cell.appendChild(numDiv);

        const turnsContainer = document.createElement('div');
        turnsContainer.className = 'turns-container';

        ['T1','T2','T3'].forEach(turno => {
          const k = key(dateStr, turno);
          const tasks = planData[k] || [];

          // Separar producción y pruebas
          const prodTasks = tasks.filter(t => t.tarea === 'Producción');
          const pruebaTasks = tasks.filter(t => t.tarea === 'Prueba');

          // Procesar cambios en producción
          let displayProds = [];
          if (prodTasks.length === 1) {
            displayProds.push(prodTasks[0]);
          } else if (prodTasks.length > 1) {
            const inicios = prodTasks.filter(t => t.esInicio);
            const fines = prodTasks.filter(t => t.esFin && !t.esInicio);
            inicios.forEach(t => {
              t.showChangeIcon = fines.length > 0;
              displayProds.push(t);
            });
            // Si hay tareas que son inicio y fin (único día), también se muestran
            prodTasks.filter(t => t.esInicio && t.esFin).forEach(t => {
              if (!displayProds.includes(t)) displayProds.push(t);
            });
          }

          const turnCol = document.createElement('div');
          turnCol.className = 'turn-column';

          const turnLabel = document.createElement('div');
          turnLabel.className = 'turn-label';
          turnLabel.textContent = turno;
          turnCol.appendChild(turnLabel);

          if (displayProds.length === 0 && pruebaTasks.length === 0) {
            const emptyText = document.createElement('span');
            emptyText.className = 'empty-turn';
            emptyText.textContent = '—';
            turnCol.appendChild(emptyText);
          } else {
            // Mostrar producciones (ya procesadas)
            displayProds.forEach(task => {
              const taskDiv = document.createElement('div');
              taskDiv.className = 'turn-task';

              if (task.showChangeIcon) {
                const changeEmoji = document.createElement('span');
                changeEmoji.className = 'change-emoji';
                changeEmoji.textContent = '🔄️';
                taskDiv.appendChild(changeEmoji);
              } else {
                const img = document.createElement('img');
                img.className = 'mold-image';
                img.src = getImageSrc(task.baseName);
                img.alt = task.moldeCompleto;
                img.onerror = function() { this.src = FALLBACK_IMG; this.onerror = null; };
                taskDiv.appendChild(img);
              }

              const nameSpan = document.createElement('span');
              nameSpan.className = 'mold-name';
              nameSpan.textContent = task.moldeCompleto;
              nameSpan.title = task.moldeCompleto;
              taskDiv.appendChild(nameSpan);

              turnCol.appendChild(taskDiv);
            });

            // Mostrar pruebas con estilo especial
            pruebaTasks.forEach(task => {
              const taskDiv = document.createElement('div');
              taskDiv.className = 'turn-task prueba';

              const img = document.createElement('img');
              img.className = 'mold-image';
              img.src = getImageSrc(task.baseName);
              img.alt = task.moldeCompleto;
              img.onerror = function() { this.src = FALLBACK_IMG; this.onerror = null; };
              taskDiv.appendChild(img);

              const nameSpan = document.createElement('span');
              nameSpan.className = 'mold-name';
              nameSpan.textContent = task.moldeCompleto;
              nameSpan.title = task.moldeCompleto;
              taskDiv.appendChild(nameSpan);

              const pruebaLabel = document.createElement('span');
              pruebaLabel.className = 'prueba-label';
              pruebaLabel.textContent = 'PR';
              taskDiv.appendChild(pruebaLabel);

              turnCol.appendChild(taskDiv);
            });
          }

          turnsContainer.appendChild(turnCol);
        });

        cell.appendChild(turnsContainer);
        grid.appendChild(cell);
      }
    }

    function cambiarMes(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      loadData();
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = 
        now.toLocaleDateString('es-AR', { weekday:'short', year:'numeric', month:'short', day:'numeric' }) + 
        ' · ' + now.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
    }

    window.addEventListener('load', () => {
      updateClock();
      setInterval(updateClock, 30000);
      loadData();
    });
  </script>
</body>
</html>
