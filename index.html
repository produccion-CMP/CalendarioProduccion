<!DOCTYPE html>
<html lang="es" data-theme="cerámica">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificación Producción | Cerámica Marcos Paz</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-base: #1a1614;
      --bg-panel: #29211e;
      --bg-input: #3b302c;
      --border: #524039;
      --text-main: #f5ece9;
      --text-muted: #a89a95;
      --terracota: #c25934;
      --terracota-hover: #a14525;
      --arcilla: #8c4731;
      --success: #2e7d32;
      --warning: #ed6c02;
      --danger: #d32f2f;
      --prueba: #0288d1;
    }
    body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-base); color: var(--text-main); }
    * { box-sizing: border-box; }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 15px 30px; border-bottom: 2px solid var(--terracota); }
    .header-logo { display: flex; align-items: center; gap: 15px; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; color: var(--terracota); }
    .header-logo img { height: 40px; border-radius: 4px; }
    .header-controls { display: flex; align-items: center; gap: 20px; }
    .reloj { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }

    /* Botones */
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; transition: background 0.2s; }
    .btn-primary { background-color: var(--terracota); color: #fff; }
    .btn-primary:hover { background-color: var(--terracota-hover); }
    .btn-outline { background-color: transparent; border: 1px solid var(--terracota); color: var(--terracota); }
    .btn-outline:hover { background-color: rgba(194, 89, 52, 0.1); }

    /* Vistas */
    .view { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
    .view.active { display: block; }

    /* Calendario */
    .cal-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-header-day { text-align: center; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .cal-cell { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; min-height: 120px; padding: 10px; position: relative; }
    .cal-cell-date { font-weight: 800; font-size: 1.1rem; color: var(--text-muted); margin-bottom: 8px; display: block; }
    
    /* Indicadores de Planificación */
    .plan-bloque { background: var(--arcilla); padding: 6px; border-radius: 4px; margin-bottom: 5px; font-size: 0.8rem; border-left: 4px solid var(--terracota); }
    .plan-titulo { font-weight: 800; display: block; margin-bottom: 2px; }
    .badge-prueba { position: absolute; top: 8px; right: 8px; background: var(--prueba); color: white; font-size: 0.65rem; padding: 3px 6px; border-radius: 10px; font-weight: 700; }
    
    /* Cumplimiento */
    .estado-cumplimiento { display: flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 700; margin-top: 5px; padding: 4px; border-radius: 3px; background: rgba(0,0,0,0.2); }
    .cumplido { color: #81c784; }
    .desvio { color: #e57373; }

    /* Formulario */
    .form-container { background: var(--bg-panel); padding: 30px; border-radius: 8px; border: 1px solid var(--border); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .form-group input, .form-group select { padding: 12px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); border-radius: 4px; font-size: 0.95rem; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--terracota); }
    .full-width { grid-column: 1 / -1; }

    #loader { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26,22,20,0.9); display: flex; justify-content: center; align-items: center; color: var(--terracota); font-weight: 800; z-index: 9999; }
  </style>
</head>
<body>

  <div id="loader">SINCRONIZANDO DATOS DE PRODUCCIÓN...</div>

  <header class="header">
    <div class="header-logo">
      <!-- Placeholder de logo. Reemplazar src por URL de imagen subida al repo -->
      <img src="https://via.placeholder.com/40x40/c25934/ffffff?text=CMP" alt="Logo Cerámica Marcos Paz">
      CERÁMICA MARCOS PAZ
    </div>
    <div class="header-controls">
      <span class="reloj" id="liveClock"></span>
      <button class="btn btn-outline" onclick="switchView('view-calendar')">🗓️ Cronograma</button>
      <button class="btn btn-primary" onclick="switchView('view-form')">➕ Nueva Planificación</button>
    </div>
  </header>

  <!-- VISTA CALENDARIO -->
  <main id="view-calendar" class="view active">
    <div class="cal-controls">
      <button class="btn btn-outline" onclick="cambiarMes(-1)">◀ ANTERIOR</button>
      <h2 id="mesActualEtiqueta" style="margin:0; text-transform:uppercase; letter-spacing: 1px; color: var(--terracota);"></h2>
      <button class="btn btn-outline" onclick="cambiarMes(1)">SIGUIENTE ▶</button>
    </div>
    <div class="cal-grid" id="calendarioGrid"></div>
  </main>

  <!-- VISTA FORMULARIO (NUEVO REGISTRO) -->
  <main id="view-form" class="view">
    <div class="form-container">
      <h2 style="margin-top:0; color: var(--terracota); border-bottom: 1px solid var(--border); padding-bottom: 10px;">Generar Registro de Planificación</h2>
      <form id="planForm" onsubmit="enviarPlanificacion(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>Molde</label>
            <select id="f_molde" required></select>
          </div>
          <div class="form-group">
            <label>Tarea</label>
            <select id="f_tarea" required>
              <option value="Producción">Producción</option>
              <option value="Prueba">Prueba</option>
            </select>
          </div>
          <div class="form-group">
            <label>Fecha Inicio</label>
            <input type="date" id="f_fecha_ini" required>
          </div>
          <div class="form-group">
            <label>Turno Inicio</label>
            <select id="f_turno_ini" required><option>M</option><option>T</option><option>N</option></select>
          </div>
          <div class="form-group">
            <label>Fecha Fin</label>
            <input type="date" id="f_fecha_fin" required>
          </div>
          <div class="form-group">
            <label>Turno Fin</label>
            <select id="f_turno_fin" required><option>M</option><option>T</option><option>N</option></select>
          </div>
          <div class="form-group full-width" style="margin-top: 15px;">
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1rem;">📤 Registrar en Base de Datos</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    // URLs de CSV Publicados
    const URL_MOLDES = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=0&single=true&output=csv";
    const URL_PLAN = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=304716517&single=true&output=csv";
    const URL_EJECUCION = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=1874633951&single=true&output=csv";

    let db = { moldes: [], planificacion: [], ejecucion: [] };
    let fechaExplorador = new Date();

    // Inicialización
    document.addEventListener('DOMContentLoaded', async () => {
      setInterval(actualizarReloj, 1000);
      actualizarReloj();
      await cargarDatos();
      poblarSelectMoldes();
      renderizarCalendario();
      document.getElementById('loader').style.display = 'none';
    });

    function actualizarReloj() {
      const el = document.getElementById("liveClock");
      el.innerText = new Date().toLocaleString('es-AR', { dateStyle: 'long', timeStyle: 'medium' });
    }

    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // Extracción de datos vía PapaParse
    async function fetchCSV(url) {
      return new Promise((resolve) => {
        Papa.parse(url, { download: true, header: true, skipEmptyLines: true, complete: res => resolve(res.data) });
      });
    }

    async function cargarDatos() {
      const [moldes, plan, ejecucion] = await Promise.all([ fetchCSV(URL_MOLDES), fetchCSV(URL_PLAN), fetchCSV(URL_EJECUCION) ]);
      db.moldes = moldes;
      db.planificacion = plan;
      db.ejecucion = ejecucion;
    }

    function poblarSelectMoldes() {
      const sel = document.getElementById('f_molde');
      db.moldes.forEach(m => {
        if (m.Molde) {
          const opt = document.createElement('option');
          opt.value = m.Molde;
          opt.text = `${m.Molde} - ${m.Estado}`;
          sel.appendChild(opt);
        }
      });
    }

    // Lógica del Calendario
    function cambiarMes(delta) {
      fechaExplorador.setMonth(fechaExplorador.getMonth() + delta);
      renderizarCalendario();
    }

    function parseFechaArg(fechaStr) {
      if(!fechaStr) return null;
      const partes = fechaStr.split('/');
      if (partes.length === 3) return new Date(partes[2], partes[1] - 1, partes[0]);
      return new Date(fechaStr); // Fallback
    }

    function renderizarCalendario() {
      const grid = document.getElementById('calendarioGrid');
      grid.innerHTML = '';
      const year = fechaExplorador.getFullYear();
      const month = fechaExplorador.getMonth();
      
      const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
      document.getElementById('mesActualEtiqueta').innerText = `${meses[month]} ${year}`;

      ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(d => {
        const el = document.createElement('div');
        el.className = 'cal-header-day'; el.innerText = d; grid.appendChild(el);
      });

      const primerDia = new Date(year, month, 1).getDay();
      const diasEnMes = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < primerDia; i++) {
        const empty = document.createElement('div');
        empty.style.background = 'transparent'; empty.style.border = 'none'; grid.appendChild(empty);
      }

      for (let d = 1; d <= diasEnMes; d++) {
        const celda = document.createElement('div');
        celda.className = 'cal-cell';
        const fechaActualCelda = new Date(year, month, d);
        
        celda.innerHTML = `<span class="cal-cell-date">${d}</span>`;

        // Filtrar planificaciones activas en este día
        const planesActivos = db.planificacion.filter(p => {
          const ini = parseFechaArg(p['FECHA INICIO']);
          const fin = parseFechaArg(p['FECHA FIN']);
          if (!ini || !fin) return false;
          // Normalizar horas para comparar solo días
          ini.setHours(0,0,0,0); fin.setHours(23,59,59,999);
          return fechaActualCelda >= ini && fechaActualCelda <= fin;
        });

        // Filtrar ejecuciones reales en este día
        const fStr = `${d}/${month+1}/${year}`;
        const ejecucionDia = db.ejecucion.filter(e => e['Día'] === fStr);

        planesActivos.forEach(plan => {
          const esPrueba = plan['TAREA'] && plan['TAREA'].trim().toUpperCase() === 'PRUEBA';
          
          if (esPrueba) {
             celda.innerHTML += `<div class="badge-prueba" title="Molde: ${plan['MOLDE']}">🧪 Prueba</div>`;
          } else {
             // Verificar cumplimiento
             const moldePlan = plan['MOLDE'];
             const moldeEjecutado = ejecucionDia.find(e => e['N° de molde'] === moldePlan);
             
             let estadoHtml = '';
             // Si la fecha actual celda es menor a hoy, evaluamos cumplimiento
             const hoy = new Date(); hoy.setHours(0,0,0,0);
             if (fechaActualCelda < hoy) {
                 if (moldeEjecutado) {
                     estadoHtml = `<div class="estado-cumplimiento cumplido">✅ Ejecutado</div>`;
                 } else {
                     estadoHtml = `<div class="estado-cumplimiento desvio">❌ Desvío/Falta</div>`;
                 }
             } else if (fechaActualCelda.getTime() === hoy.getTime() && moldeEjecutado) {
                  estadoHtml = `<div class="estado-cumplimiento cumplido">✅ En Producción</div>`;
             }

             celda.innerHTML += `
               <div class="plan-bloque">
                 <span class="plan-titulo">🧱 ${moldePlan}</span>
                 <span style="font-size:0.7rem; color: var(--text-muted);">Turno: ${plan['TURNO INICIO']} a ${plan['TURNO FIN']}</span>
                 ${estadoHtml}
               </div>
             `;
          }
        });
        grid.appendChild(celda);
      }
    }

    // Inserción de Datos (Simulada para Frontend)
    function enviarPlanificacion(e) {
      e.preventDefault();
      
      const payload = {
        molde: document.getElementById('f_molde').value,
        tarea: document.getElementById('f_tarea').value,
        fecha_ini: document.getElementById('f_fecha_ini').value,
        turno_ini: document.getElementById('f_turno_ini').value,
        fecha_fin: document.getElementById('f_fecha_fin').value,
        turno_fin: document.getElementById('f_turno_fin').value
      };

      /* 
       * NOTA TÉCNICA OBLIGATORIA:
       * Desde GitHub Pages (estático) no se puede inyectar directamente a Google Sheets.
       * Debe crear un script en Apps Script asociado al Sheet "DatosProd" con el método doPost(e).
       * El siguiente fetch apunta a ese webhook (sustituir URL_WEBAPP_GAS).
       */
      const URL_WEBAPP_GAS = "URL_DE_SU_SCRIPT_DOPOST_AQUI"; 
      
      document.getElementById('loader').innerText = "TRANSMITIENDO AL SERVIDOR...";
      document.getElementById('loader').style.display = 'flex';

      // Simulación de envío por carencia del endpoint doPost configurado por el usuario
      setTimeout(() => {
        document.getElementById('loader').style.display = 'none';
        alert(`Planificación de ${payload.molde} registrada exitosamente (Simulado. Requiere configuración doPost en GAS).`);
        document.getElementById('planForm').reset();
        switchView('view-calendar');
      }, 1500);

      /* Código real para POST:
      fetch(URL_WEBAPP_GAS, {
        method: 'POST',
        mode: 'no-cors', // Evita errores de CORS de Google
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
         // Recargar datos y renderizar
      });
      */
    }
  </script>
</body>
</html>
