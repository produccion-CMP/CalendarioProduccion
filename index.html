<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cerámica Marcos Paz – Planificación de Producción</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-body: #1a1814;
      --bg-panel: #25221d;
      --bg-cell: #2f2a24;
      --border: #4a4238;
      --text-main: #f0e6d8;
      --text-muted: #b8a99a;
      --accent: #d97736;       /* terracota */
      --accent-light: #e8a87c;
      --green: #4caf50;
      --red: #e53935;
      --blue: #5c8bc9;
      --badge-bg: rgba(255,255,255,0.08);
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ENCABEZADO */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo-container img {
      height: 55px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .title-block h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-light);
    }
    .title-block small {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .live-clock {
      background: var(--bg-panel);
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
      text-align: right;
    }
    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: var(--shadow);
    }
    .btn-add:hover { background: #c85d2a; transform: translateY(-1px); }

    /* NAVEGACIÓN MES */
    .month-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      margin-bottom: 25px;
    }
    .month-nav button {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .month-nav button:hover { background: var(--accent); border-color: var(--accent); }
    .month-label {
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-light);
    }

    /* CALENDARIO */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      flex: 1;
    }
    .day-name {
      text-align: center;
      font-weight: 700;
      color: var(--text-muted);
      padding: 10px 0;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
    .day-cell {
      background: var(--bg-cell);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      min-height: 110px;
      transition: 0.15s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .day-cell:hover {
      border-color: var(--accent);
      background: #36312a;
    }
    .day-number {
      font-weight: 800;
      font-size: 0.9rem;
      margin-bottom: 5px;
      color: var(--text-main);
    }
    .turno-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 2px 0;
      padding: 2px 4px;
      border-radius: 6px;
      background: rgba(0,0,0,0.2);
      font-size: 0.7rem;
    }
    .turno-badge {
      font-weight: 700;
      color: var(--accent-light);
      min-width: 22px;
    }
    .molde-chip {
      flex: 1;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      background: var(--badge-bg);
      border-left: 3px solid var(--accent);
      color: var(--text-main);
    }
    .status-icon {
      margin-left: auto;
      font-size: 0.9rem;
    }

    /* LEYENDA */
    .legend {
      margin-top: 30px;
      background: var(--bg-panel);
      border-radius: var(--radius);
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      box-shadow: var(--shadow);
      font-size: 0.8rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-dot {
      width: 14px; height: 14px; border-radius: 4px;
    }

    @media (max-width: 640px) {
      .day-cell { min-height: 80px; padding: 4px; }
      .molde-chip { max-width: 50px; }
    }
  </style>
</head>
<body>
  <!-- ENCABEZADO -->
  <header class="app-header">
    <div class="logo-container">
      <!-- CAMBIÁ la ruta por la de tu logo (relativa o absoluta) -->
      <img src="logo.png" alt="Cerámica Marcos Paz">
      <div class="title-block">
        <h1>Producción Ladrillos Cerámicos</h1>
        <small>Tucumán, Argentina — Planta CEVIL</small>
      </div>
    </div>
    <div class="header-actions">
      <div class="live-clock" id="liveClock"></div>
      <a href="admin.html" class="btn-add">🧱 + Nuevo Plan</a>
    </div>
  </header>

  <!-- NAVEGACIÓN DEL MES -->
  <div class="month-nav">
    <button onclick="cambiarMes(-1)">◀ Anterior</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="cambiarMes(1)">Siguiente ▶</button>
  </div>

  <!-- CALENDARIO -->
  <div class="calendar-grid" id="calendarGrid"></div>

  <!-- LEYENDA -->
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50;"></div> Cumplido (plan = real)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e53935;"></div> Desvío (plan ≠ real)</div>
    <div class="legend-item"><span style="font-size:1.1rem;">🔬</span> Prueba ejecutada</div>
    <div class="legend-item"><span style="font-size:1.1rem;">🧱</span> Producción planificada</div>
    <div class="legend-item"><div class="legend-dot" style="background:#5c8bc9;"></div> Real sin plan</div>
    <div class="legend-item"><span>⏳</span> Pendiente (sin real)</div>
  </div>

  <script>
    // ========== CONFIGURACIÓN (CSVs públicos) ==========
    const CSV_PLAN   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=304716517&single=true&output=csv';
    const CSV_REAL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=1874633951&single=true&output=csv';

    // Datos procesados
    let planData = {};   // { '2026-07-31_T1': { molde, tipo } }
    let realData = {};   // { '2026-07-31_T1': 'molde' }
    let currentDate = new Date();

    // ========== FUNCIONES ==========
    async function fetchCSV(url) {
      const resp = await fetch(url);
      const text = await resp.text();
      return new Promise(resolve => {
        Papa.parse(text, { header: true, skipEmptyLines: true, complete: r => resolve(r.data) });
      });
    }

    function formatYYYYMMDD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth()+1).padStart(2,'0');
      const d = String(date.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }

    function key(fecha, turno) { return `${fecha}_${turno}`; }

    async function loadData() {
      const [planRows, realRows] = await Promise.all([fetchCSV(CSV_PLAN), fetchCSV(CSV_REAL)]);
      
      // Procesar planificación (DatosProd)
      planData = {};
      planRows.forEach(row => {
        const molde = row['MOLDE']?.trim();
        const tarea = row['TAREA']?.trim();
        const fi = row['FECHA INICIO']?.trim();
        const ti = row['TURNO INICIO']?.trim();
        const ff = row['FECHA FIN']?.trim();
        const tf = row['TURNO FIN']?.trim();
        if (!molde || !fi || !ff) return;

        const inicio = new Date(fi + 'T00:00:00');
        const fin = new Date(ff + 'T00:00:00');
        const turnos = ['T1','T2','T3'];

        for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate()+1)) {
          const dayStr = formatYYYYMMDD(d);
          let turnosDia = [];
          if (d.getTime() === inicio.getTime() && d.getTime() === fin.getTime()) {
            const idx1 = turnos.indexOf(ti), idx2 = turnos.indexOf(tf);
            for (let i = idx1; i <= idx2; i++) turnosDia.push(turnos[i]);
          } else if (d.getTime() === inicio.getTime()) {
            const idx1 = turnos.indexOf(ti);
            for (let i = idx1; i < 3; i++) turnosDia.push(turnos[i]);
          } else if (d.getTime() === fin.getTime()) {
            const idx2 = turnos.indexOf(tf);
            for (let i = 0; i <= idx2; i++) turnosDia.push(turnos[i]);
          } else {
            turnosDia = ['T1','T2','T3'];
          }
          turnosDia.forEach(t => {
            planData[key(dayStr, t)] = { molde, tipo: tarea };
          });
        }
      });

      // Procesar real (ProduccionMoldes)
      realData = {};
      realRows.forEach(row => {
        const dia = row['Día']?.trim();            // formato DD/MM/AAAA
        const turno = row['Turno']?.trim();
        const moldeReal = row['L. carga (N)']?.trim();   // nombre completo
        if (!dia || !turno || !moldeReal) return;
        const partes = dia.split('/');
        if (partes.length !== 3) return;
        const fecha = new Date(partes[2], partes[1]-1, partes[0]);
        realData[key(formatYYYYMMDD(fecha), turno)] = moldeReal;
      });

      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();

      document.getElementById('monthLabel').textContent = 
        currentDate.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }).toUpperCase();

      const weekdays = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
      weekdays.forEach(d => {
        const el = document.createElement('div');
        el.className = 'day-name';
        el.textContent = d;
        grid.appendChild(el);
      });

      for (let i = 0; i < firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const numDiv = document.createElement('div');
        numDiv.className = 'day-number';
        numDiv.textContent = d;
        cell.appendChild(numDiv);

        ['T1','T2','T3'].forEach(turno => {
          const k = key(dateStr, turno);
          const plan = planData[k];
          const real = realData[k];

          const row = document.createElement('div');
          row.className = 'turno-row';

          const turnoBadge = document.createElement('span');
          turnoBadge.className = 'turno-badge';
          turnoBadge.textContent = turno;
          row.appendChild(turnoBadge);

          if (plan) {
            const chip = document.createElement('span');
            chip.className = 'molde-chip';
            // Color único por molde
            const hue = [...plan.molde].reduce((acc, c) => acc + c.charCodeAt(0), 0) % 360;
            chip.style.borderLeftColor = `hsl(${hue}, 65%, 55%)`;
            chip.style.background = `linear-gradient(90deg, hsla(${hue}, 60%, 20%, 0.4), transparent)`;
            chip.innerHTML = (plan.tipo === 'Prueba' ? '🔬' : '🧱') + ' ' + plan.molde;
            row.appendChild(chip);

            const status = document.createElement('span');
            status.className = 'status-icon';
            if (real) {
              if (real === plan.molde) {
                status.innerHTML = '✅';
                chip.style.border = '1px solid #4caf50';
              } else {
                status.innerHTML = '❌';
                chip.style.border = '1px solid #e53935';
                // Mostrar también el molde real
                const realChip = document.createElement('span');
                realChip.className = 'molde-chip';
                const realHue = [...real].reduce((acc, c) => acc + c.charCodeAt(0), 0) % 360;
                realChip.style.borderLeftColor = `hsl(${realHue}, 65%, 55%)`;
                realChip.style.background = `linear-gradient(90deg, hsla(${realHue}, 60%, 20%, 0.4), transparent)`;
                realChip.textContent = '🔄 ' + real;
                realChip.style.marginLeft = '3px';
                row.appendChild(realChip);
              }
            } else {
              status.innerHTML = '⏳';
            }
            row.appendChild(status);
          } else if (real) {
            const chip = document.createElement('span');
            chip.className = 'molde-chip';
            chip.style.borderLeftColor = '#5c8bc9';
            chip.style.background = 'linear-gradient(90deg, rgba(92,139,201,0.2), transparent)';
            chip.innerHTML = '⚙️ ' + real;
            row.appendChild(chip);
            const status = document.createElement('span');
            status.className = 'status-icon';
            status.innerHTML = '📌';
            row.appendChild(status);
          } else {
            const empty = document.createElement('span');
            empty.style.color = '#555';
            empty.textContent = '—';
            empty.style.flex = '1';
            row.appendChild(empty);
          }

          cell.appendChild(row);
        });

        grid.appendChild(cell);
      }
    }

    function cambiarMes(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      loadData();
    }

    // Reloj
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').textContent = 
        now.toLocaleDateString('es-AR', { weekday:'short', year:'numeric', month:'short', day:'numeric' }) + 
        ' · ' + now.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
    }

    window.addEventListener('load', () => {
      updateClock();
      setInterval(updateClock, 30000);
      loadData();
    });
  </script>
</body>
</html>
