<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cronograma de Producción – Cerámica Marcos Paz</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-body: #1a1814;
      --bg-panel: #25221d;
      --bg-cell: #2f2a24;
      --border: #4a4238;
      --text-main: #f0e6d8;
      --text-muted: #b8a99a;
      --accent: #d97736;
      --accent-light: #e8a87c;
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
      --radius: 12px;
      --cell-height: 130px;
      --prueba-bg: hsla(45, 80%, 90%, 0.25);
      --prueba-border: #f1c40f;
      --logo-shadow: drop-shadow(0 2px 4px rgba(255,255,255,0.7));
      --day-header-plan: #ff9800;
      --day-header-real: #4caf50;
      --day-header-today: #ffd700;
    }

    body.light-mode {
      --bg-body: #f5f0eb;
      --bg-panel: #ffffff;
      --bg-cell: #fdf8f2;
      --border: #d7ccc8;
      --text-main: #4a3b32;
      --text-muted: #8d7b6c;
      --accent: #cc6b4b;
      --accent-light: #a0522d;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
      --prueba-bg: hsla(45, 80%, 90%, 0.6);
      --logo-shadow: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .app-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 25px; padding: 15px 20px; background: var(--bg-panel); border-radius: var(--radius); box-shadow: var(--shadow); }
    .logo-container { display: flex; align-items: center; gap: 15px; }
    .logo-container img { height: 55px; filter: var(--logo-shadow); }
    .title-block h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent-light); }
    .title-block small { font-size: 0.8rem; color: var(--text-muted); }

    .header-actions { display: flex; align-items: center; gap: 15px; }
    .live-clock { background: rgba(0,0,0,0.3); padding: 10px 18px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; backdrop-filter: blur(5px); }
    .btn-icon { background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
    .btn-add, .btn-print { padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: background 0.2s; border: none; color: #fff; box-shadow: var(--shadow); }
    .btn-add { background: var(--accent); }
    .btn-add:hover { background: #c85d2a; }
    .btn-print { background: #4a4238; }
    .btn-print:hover { background: #5e5548; }

    .month-nav { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 25px; }
    .month-nav button { background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); padding: 10px 20px; border-radius: 30px; font-weight: 600; cursor: pointer; }
    .month-nav button:hover { background: var(--accent); border-color: var(--accent); }
    .month-label { font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-light); }

    .calendar-wrapper { background: var(--bg-panel); border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); margin-bottom: 25px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    .weekdays div { padding: 8px 0; font-size: 0.8rem; text-transform: uppercase; }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-cell { background: var(--bg-cell); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; min-height: var(--cell-height); overflow: hidden; transition: 0.15s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
    .day-cell:hover { border-color: var(--accent); }
    .day-number { font-weight: 800; font-size: 0.9rem; padding: 6px 8px 2px; color: var(--text-main); text-align: center; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; }
    .day-header-plan { background-color: var(--day-header-plan) !important; color: #000; }
    .day-header-real { background-color: var(--day-header-real) !important; color: #000; }
    .day-header-today { background-color: var(--day-header-today) !important; color: #000; font-weight: 900; }
    .day-header-today.day-header-plan, .day-header-today.day-header-real { border: 2px solid #000; }

    .turns-container { display: flex; flex: 1; flex-direction: row; }
    .turn-column { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 2px; border-right: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 0.7rem; overflow-y: auto; max-height: 100%; position: relative; }
    .turn-column:last-child { border-right: none; }
    .turn-label { font-weight: 700; color: var(--accent-light); font-size: 0.6rem; margin-bottom: 3px; text-transform: uppercase; }
    .empty-turn { color: var(--text-muted); font-size: 0.65rem; margin-top: 8px; }

    .turn-task { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; padding: 3px 2px; border-radius: 4px; width: 100%; cursor: pointer; transition: transform 0.1s; }
    .turn-task:hover { transform: scale(1.02); }
    .mold-image { width: 28px; height: 28px; object-fit: contain; border-radius: 4px; margin-bottom: 2px; background: rgba(255,255,255,0.05); padding: 2px; }
    .mold-base { font-weight: 700; font-size: 0.7rem; color: inherit; margin-bottom: 1px; white-space: normal; word-wrap: break-word; line-height: 1.1; }
    .mold-number { font-weight: 600; font-size: 0.6rem; color: inherit; opacity: 0.8; white-space: normal; word-wrap: break-word; line-height: 1.1; }
    .change-label, .prueba-label { font-size: 0.5rem; border-radius: 3px; padding: 0 2px; font-weight: 700; margin-top: 1px; line-height: 1.2; }
    .change-label { background: var(--accent); color: #fff; }
    .prueba-label { background: #f1c40f; color: #000; }

    .continuation-bar { width: 100%; flex: 1; min-height: 20px; border-radius: 3px; margin: 1px 0; opacity: 0.85; box-shadow: inset 0 0 6px rgba(0,0,0,0.4); cursor: pointer; }

    .real-card { display: flex; flex-direction: column; align-items: center; padding: 4px 2px; border-radius: 6px 6px 0 0; width: 100%; margin-bottom: 0; cursor: pointer; transition: transform 0.1s; }
    .real-card:hover { transform: scale(1.02); }

    .compliance-row { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 4px; }
    .compliance-bar-h { width: 100%; height: 5px; border-radius: 0 0 6px 6px; position: relative; overflow: hidden; }
    .compliance-bar-h::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: shimmer 2s infinite; }
    @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }
    .compliance-emoji { margin-top: 2px; font-size: 0.9rem; animation: pulse-emoji 1.5s ease-in-out infinite; }
    @keyframes pulse-emoji { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    .green-bar { background: #4caf50; } .green-emoji { color: #4caf50; }
    .orange-bar { background: #ff9800; } .orange-emoji { color: #ff9800; }
    .red-bar { background: #e53935; } .red-emoji { color: #e53935; }
    .gray-bar { background: #9e9e9e; } .gray-emoji { color: #9e9e9e; }

    .custom-tooltip { position: fixed; background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 0.8rem; box-shadow: 0 6px 18px rgba(0,0,0,0.6); z-index: 9999; pointer-events: none; max-width: 220px; color: var(--text-main); display: none; }
    .custom-tooltip strong { color: var(--accent-light); }

    .resumen-mes { background: var(--bg-panel); border-radius: var(--radius); padding: 15px 20px; box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; font-size: 0.9rem; margin-bottom: 20px; }
    .resumen-item { text-align: center; min-width: 100px; }
    .resumen-valor { font-size: 1.6rem; font-weight: 800; color: var(--accent-light); }

    .legend { margin-top: 20px; background: var(--bg-panel); border-radius: var(--radius); padding: 15px 20px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; box-shadow: var(--shadow); font-size: 0.8rem; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 4px; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 10000; }
    .modal-content { background: var(--bg-panel); border-radius: var(--radius); padding: 25px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: var(--shadow); }
    .modal-close { float: right; background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
    .gantt-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8rem; }
    .gantt-table th, .gantt-table td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; }
    .gantt-table th { color: var(--accent-light); }

    @media print { /* ...igual que antes, omitido por brevedad... */ }
    @media (max-width: 640px) { .day-cell { min-height: 100px; } .mold-image { width: 20px; height: 20px; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="logo-container">
      <img src="img/logo CMP.png" alt="Cerámica Marcos Paz">
      <div class="title-block">
        <h1>Cronograma de Producción</h1>
        <small>Cerámica Marcos Paz - Planta CEVIL</small>
      </div>
    </div>
    <div class="header-actions">
      <div class="live-clock" id="liveClock"></div>
      <button class="btn-icon" onclick="toggleTheme()">🌓</button>
      <a href="admin.html" class="btn-add">🧱 + Nuevo Plan</a>
      <button class="btn-print" onclick="window.print()">🖨️ Imprimir Mes</button>
    </div>
  </header>

  <div class="month-nav">
    <button onclick="cambiarMes(-1)">◀ Anterior</button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="cambiarMes(1)">Siguiente ▶</button>
  </div>

  <div class="resumen-mes" id="resumenMes"></div>

  <div class="calendar-wrapper">
    <div class="weekdays"><div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div></div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4caf50;"></div> Cumplido ✅</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ff9800;"></div> Parcial ⏳</div>
    <div class="legend-item"><div class="legend-dot" style="background:#e53935;"></div> Desvío ⚠️</div>
    <div class="legend-item"><div class="legend-dot" style="background:#9e9e9e;"></div> Sin plan 📌</div>
    <div class="legend-item"><span style="font-weight:700; background:#f1c40f; color:#000; padding:0 4px; border-radius:3px;">PR</span> Prueba</div>
    <div class="legend-item"><span style="background:var(--accent); color:#fff; padding:2px 4px; border-radius:3px; font-size:0.8rem;">🔄️</span> Cambio</div>
    <div class="legend-item"><div class="legend-dot" style="background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 2px, transparent 2px, transparent 4px);"></div> Continuación</div>
  </div>

  <div class="custom-tooltip" id="customTooltip"></div>

  <script>
    // URLs actualizadas
    const CSV_PLAN = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSOrhCEi7WZWpvdA95aWRwbS0pPAqYfNBvNRi0ZHTjS1SR2dDS3B2EyXyuYda_w9xhHqObojm4t81B8/pub?gid=323741265&single=true&output=csv';
    const CSV_REAL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSOrhCEi7WZWpvdA95aWRwbS0pPAqYfNBvNRi0ZHTjS1SR2dDS3B2EyXyuYda_w9xhHqObojm4t81B8/pub?gid=1774340358&single=true&output=csv';
    const IMG_PATH = 'img/moldes/';
    const FALLBACK_IMG = 'img/moldes/default.png';

    let planData = {};         // { clave: [tasks] }
    let realDataByTurno = {}; // { clave: [moldStrings] } para cada turno, array de moldes producidos
    let realSequence = [];     // arreglo ordenado de {dateStr, turno, molds:[]}
    let currentDate = new Date();
    let themeDark = true;

    const brickTypeColors = new Map();
    function getBrickColor(baseName, number) {
      const key = `${baseName}_${number}`;
      if (brickTypeColors.has(key)) return brickTypeColors.get(key);
      let hash = 0;
      for (let i = 0; i < baseName.length; i++) hash = baseName.charCodeAt(i) + ((hash << 5) - hash);
      const hue = hash % 360;
      const lightness = 38 + number * 8;
      const color = `hsl(${hue}, 60%, ${lightness}%)`;
      brickTypeColors.set(key, color);
      return color;
    }

    function pickTextColorBasedOnBgColor(bgColor) {
      const match = bgColor.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
      if (!match) return '#000';
      const l = parseInt(match[3]);
      return l > 50 ? '#000' : '#fff';
    }

    function toggleTheme() {
      themeDark = !themeDark;
      document.body.classList.toggle('light-mode', !themeDark);
      localStorage.setItem('theme', themeDark ? 'dark' : 'light');
    }
    (function() {
      if (localStorage.getItem('theme') === 'light') {
        themeDark = false;
        document.body.classList.add('light-mode');
      }
    })();

    async function fetchCSV(url) { /* igual que antes */ }
    function formatYYYYMMDD(date) { /* igual */ }
    function key(fecha, turno) { return `${fecha}_${turno}`; }
    function getBaseName(molde) { let b = molde.split(' (')[0].trim(); b = b.split(/[xX]/)[0].trim(); return b; }
    function getMoldNumber(molde) { const m = molde.match(/\((\d+)\)/); return m ? parseInt(m[1]) : 1; }
    function getImageSrc(base) { return `${IMG_PATH}${base}.png`; }

    const tooltip = document.getElementById('customTooltip');
    function showTooltip(e, content) { tooltip.innerHTML = content; tooltip.style.display = 'block'; tooltip.style.left = (e.clientX+15)+'px'; tooltip.style.top = (e.clientY-20)+'px'; }
    function hideTooltip() { tooltip.style.display = 'none'; }

    async function loadData() {
      const [planRows, realRows] = await Promise.all([fetchCSV(CSV_PLAN), fetchCSV(CSV_REAL)]);
      
      // Procesar plan (DatosProd)
      planData = {};
      planRows.forEach(row => {
        const molde = row['LADRILLO:']?.trim();
        const tarea = row['TAREA:']?.trim();
        const fi = row['FECHA INICIO:']?.trim();
        const ti = row['TURNO INICIO:']?.trim();
        const ff = row['FECHA FIN:']?.trim();
        const tf = row['TURNO FIN:']?.trim();
        if (!molde || !fi || !ff) return;
        const inicio = new Date(fi + 'T00:00:00');
        const fin = new Date(ff + 'T00:00:00');
        if (isNaN(inicio) || isNaN(fin)) return;
        const turnos = ['T1','T2','T3'];
        for (let d = new Date(inicio); d <= fin; d.setDate(d.getDate()+1)) {
          const dayStr = formatYYYYMMDD(d);
          let turnosDia = [];
          if (d.getTime() === inicio.getTime() && d.getTime() === fin.getTime()) {
            const i1 = turnos.indexOf(ti), i2 = turnos.indexOf(tf);
            for (let i = i1; i <= i2; i++) turnosDia.push(turnos[i]);
          } else if (d.getTime() === inicio.getTime()) {
            const i1 = turnos.indexOf(ti);
            for (let i = i1; i < 3; i++) turnosDia.push(turnos[i]);
          } else if (d.getTime() === fin.getTime()) {
            const i2 = turnos.indexOf(tf);
            for (let i = 0; i <= i2; i++) turnosDia.push(turnos[i]);
          } else {
            turnosDia = ['T1','T2','T3'];
          }
          turnosDia.forEach(t => {
            const k = key(dayStr, t);
            if (!planData[k]) planData[k] = [];
            planData[k].push({
              moldeCompleto: molde,
              baseName: getBaseName(molde),
              number: getMoldNumber(molde),
              tarea,
              esInicio: (d.getTime() === inicio.getTime() && t === ti),
              fechaInicio: fi, turnoInicio: ti, fechaFin: ff, turnoFin: tf
            });
          });
        }
      });

      // Procesar real (ProduccionHistorica) - ordenado
      const realRowsParsed = realRows.map(r => {
        const diaRaw = r['Día']?.trim();
        const turno = r['Turno']?.trim();
        const molde = r['Molde']?.trim(); // columna E
        if (!diaRaw || !turno || !molde) return null;
        const partes = diaRaw.split('/');
        if (partes.length !== 3) return null;
        const fecha = new Date(partes[2], partes[1]-1, partes[0]);
        return { date: fecha, dateStr: formatYYYYMMDD(fecha), turno, molde };
      }).filter(Boolean);
      
      // Ordenar cronológicamente: por fecha, luego por turno (T1=0, T2=1, T3=2)
      const turnoOrder = { T1:0, T2:1, T3:2 };
      realRowsParsed.sort((a, b) => {
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        return turnoOrder[a.turno] - turnoOrder[b.turno];
      });

      // Agrupar por fecha+turno para el calendario
      realDataByTurno = {};
      realRowsParsed.forEach(r => {
        const k = key(r.dateStr, r.turno);
        if (!realDataByTurno[k]) realDataByTurno[k] = [];
        realDataByTurno[k].push(r.molde);
      });

      // Secuencia cronológica completa para continuidad (solo turnos con datos)
      realSequence = [];
      let lastDateStr = null, lastTurno = null;
      realRowsParsed.forEach(r => {
        const k = key(r.dateStr, r.turno);
        realSequence.push({ dateStr: r.dateStr, turno: r.turno, molds: realDataByTurno[k] });
      });

      renderCalendar();
      renderResumen();
    }

    // Determinar para cada turno qué mostrar de real (detalle o barra de continuación)
    function getRealDisplayState() {
      // Genera un mapa { clave: { type:'start'|'continue', mainMold:String, otherMolds:[], isChange:Boolean } }
      const state = {};
      let activeMold = null; // { molde, base, number }
      let previousKey = null;
      realSequence.forEach((item, idx) => {
        const k = key(item.dateStr, item.turno);
        const molds = item.molds;
        if (molds.length === 0) {
          activeMold = null;
          state[k] = { type:'none' };
          return;
        }
        // Determinar molde principal: si activeMold está presente en la lista, sigue siendo el principal; sino, el primer molde de la lista (o el que más se repita, pero tomamos el primero por simplicidad)
        let mainMold = null;
        if (activeMold && molds.includes(activeMold.molde)) {
          mainMold = activeMold.molde;
        } else {
          mainMold = molds[0];
        }
        const isContinuation = (activeMold && activeMold.molde === mainMold);
        const isChange = (activeMold && activeMold.molde !== mainMold);
        const otherMolds = molds.filter(m => m !== mainMold);
        state[k] = {
          type: isContinuation ? 'continue' : 'start',
          mainMold,
          otherMolds,
          isChange
        };
        // Actualizar activeMold
        activeMold = {
          molde: mainMold,
          base: getBaseName(mainMold),
          number: getMoldNumber(mainMold)
        };
        previousKey = k;
      });
      return state;
    }

    function renderCalendar() {
      const realState = getRealDisplayState();
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month+1, 0).getDate();
      const firstDay = new Date(year, month, 1).getDay();
      const todayStr = formatYYYYMMDD(new Date());

      document.getElementById('monthLabel').textContent = currentDate.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }).toUpperCase();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div'); empty.style.visibility = 'hidden'; grid.appendChild(empty);
      }

      // Para plan: controlar detalle por día (solo primer avistamiento del molde en el día)
      const detailedPlanMoldsToday = new Set(); // se reinicia cada día

      for (let d = 1; d <= daysInMonth; d++) {
        detailedPlanMoldsToday.clear();
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.addEventListener('click', () => showDayModal(dateStr));

        const hasReal = realDataByTurno[key(dateStr,'T1')] || realDataByTurno[key(dateStr,'T2')] || realDataByTurno[key(dateStr,'T3')];
        const hasPlan = planData[key(dateStr,'T1')] || planData[key(dateStr,'T2')] || planData[key(dateStr,'T3')];
        let headerClass = '';
        if (dateStr === todayStr) headerClass = 'day-header-today';
        else if (hasReal) headerClass = 'day-header-real';
        else if (hasPlan) headerClass = 'day-header-plan';

        const numDiv = document.createElement('div');
        numDiv.className = 'day-number';
        if (headerClass) numDiv.classList.add(headerClass);
        numDiv.textContent = d;
        cell.appendChild(numDiv);

        const turnsContainer = document.createElement('div');
        turnsContainer.className = 'turns-container';

        ['T1','T2','T3'].forEach(turno => {
          const k = key(dateStr, turno);
          const realMolds = realDataByTurno[k] || [];
          const plans = planData[k] || [];
          const turnCol = document.createElement('div');
          turnCol.className = 'turn-column';
          const turnLabel = document.createElement('div');
          turnLabel.className = 'turn-label';
          turnLabel.textContent = turno;
          turnCol.appendChild(turnLabel);

          if (realMolds.length > 0) {
            const rs = realState[k] || { type:'start', mainMold: realMolds[0], otherMolds:[], isChange:false };
            const mainMold = rs.mainMold || realMolds[0];
            const bgColor = getBrickColor(getBaseName(mainMold), getMoldNumber(mainMold));
            const textColor = pickTextColorBasedOnBgColor(bgColor);

            if (rs.type === 'start') {
              // Tarjeta completa
              const cardDiv = document.createElement('div');
              cardDiv.className = 'real-card';
              cardDiv.style.backgroundColor = bgColor;
              cardDiv.style.color = textColor;
              const img = document.createElement('img'); img.className = 'mold-image'; img.src = getImageSrc(getBaseName(mainMold)); img.alt = mainMold; img.onerror = () => this.src = FALLBACK_IMG;
              cardDiv.appendChild(img);
              const baseSpan = document.createElement('span'); baseSpan.className = 'mold-base'; baseSpan.textContent = getBaseName(mainMold); baseSpan.style.color = textColor;
              cardDiv.appendChild(baseSpan);
              const numSpan = document.createElement('span'); numSpan.className = 'mold-number'; numSpan.textContent = `Molde ${getMoldNumber(mainMold)}`; numSpan.style.color = textColor;
              cardDiv.appendChild(numSpan);
              if (rs.isChange) {
                const changeLbl = document.createElement('span'); changeLbl.className = 'change-label'; changeLbl.textContent = '🔄️'; cardDiv.appendChild(changeLbl);
              }
              turnCol.appendChild(cardDiv);
            } else {
              // Barra de continuación
              const barDiv = document.createElement('div');
              barDiv.className = 'continuation-bar';
              barDiv.style.backgroundColor = bgColor;
              turnCol.appendChild(barDiv);
            }

            // Siempre agregar barra de cumplimiento y emoji
            const comp = getCompliance(mainMold, plans);
            const barRow = document.createElement('div'); barRow.className = 'compliance-row';
            const barH = document.createElement('div'); barH.className = `compliance-bar-h ${comp.status === 'cumplido' ? 'green-bar' : comp.status === 'parcial' ? 'orange-bar' : comp.status === 'desvio' ? 'red-bar' : 'gray-bar'}`;
            barRow.appendChild(barH);
            const emoji = document.createElement('span'); emoji.className = `compliance-emoji ${comp.status === 'cumplido' ? 'green-emoji' : comp.status === 'parcial' ? 'orange-emoji' : comp.status === 'desvio' ? 'red-emoji' : 'gray-emoji'}`;
            emoji.textContent = comp.status === 'cumplido' ? '✅' : comp.status === 'parcial' ? '⏳' : comp.status === 'desvio' ? '⚠️' : '📌';
            barRow.appendChild(emoji);
            turnCol.appendChild(barRow);

            // Pruebas (otros moldes en el mismo turno)
            rs.otherMolds.forEach(otherMold => {
              const testDiv = document.createElement('div');
              testDiv.className = 'turn-task prueba';
              testDiv.style.backgroundColor = 'var(--prueba-bg)';
              testDiv.style.color = '#000';
              const img = document.createElement('img'); img.className = 'mold-image'; img.src = getImageSrc(getBaseName(otherMold)); img.alt = otherMold; img.onerror = () => this.src = FALLBACK_IMG;
              testDiv.appendChild(img);
              const baseSpan = document.createElement('span'); baseSpan.className = 'mold-base'; baseSpan.textContent = getBaseName(otherMold); baseSpan.style.color = '#000';
              testDiv.appendChild(baseSpan);
              const numSpan = document.createElement('span'); numSpan.className = 'mold-number'; numSpan.textContent = `Molde ${getMoldNumber(otherMold)}`; numSpan.style.color = '#000';
              testDiv.appendChild(numSpan);
              const prLbl = document.createElement('span'); prLbl.className = 'prueba-label'; prLbl.textContent = 'PR';
              testDiv.appendChild(prLbl);
              turnCol.appendChild(testDiv);
            });

            // Tooltips y eventos...
          } else if (plans.length > 0) {
            // Plan (sin real)
            const isFirstDayOfMonth = (d === 1);
            plans.forEach(task => {
              const moldKey = task.moldeCompleto;
              const showDetail = task.esInicio || (isFirstDayOfMonth && !detailedPlanMoldsToday.has(moldKey)) || (!detailedPlanMoldsToday.has(moldKey));
              if (showDetail) {
                const bgColor = getBrickColor(task.baseName, task.number);
                const textColor = pickTextColorBasedOnBgColor(bgColor);
                const taskDiv = document.createElement('div'); taskDiv.className = 'turn-task'; taskDiv.style.backgroundColor = bgColor; taskDiv.style.color = textColor;
                const img = document.createElement('img'); img.className = 'mold-image'; img.src = getImageSrc(task.baseName); img.alt = task.moldeCompleto; img.onerror = () => this.src = FALLBACK_IMG;
                taskDiv.appendChild(img);
                const baseSpan = document.createElement('span'); baseSpan.className = 'mold-base'; baseSpan.textContent = task.baseName; baseSpan.style.color = textColor;
                taskDiv.appendChild(baseSpan);
                const numSpan = document.createElement('span'); numSpan.className = 'mold-number'; numSpan.textContent = `Molde ${task.number}`; numSpan.style.color = textColor;
                taskDiv.appendChild(numSpan);
                if (task.tarea === 'Prueba') {
                  const prLbl = document.createElement('span'); prLbl.className = 'prueba-label'; prLbl.textContent = 'PR';
                  taskDiv.appendChild(prLbl);
                }
                turnCol.appendChild(taskDiv);
                detailedPlanMoldsToday.add(moldKey);
              } else {
                const barDiv = document.createElement('div'); barDiv.className = 'continuation-bar'; barDiv.style.backgroundColor = getBrickColor(task.baseName, task.number);
                turnCol.appendChild(barDiv);
              }
              // Tooltips...
            });
          } else {
            const empty = document.createElement('span'); empty.className = 'empty-turn'; empty.textContent = '—';
            turnCol.appendChild(empty);
          }
          turnsContainer.appendChild(turnCol);
        });
        cell.appendChild(turnsContainer);
        grid.appendChild(cell);
      }
    }

    function getCompliance(realMold, plans) {
      if (!realMold) return { status: 'sinPlan' };
      const prodPlans = plans.filter(p => p.tarea === 'Producción');
      const testPlans = plans.filter(p => p.tarea === 'Prueba');
      const match = prodPlans.find(p => p.moldeCompleto === realMold);
      if (prodPlans.length === 0 && testPlans.length > 0) return { status: 'desvio' };
      if (match) {
        if (testPlans.length > 0) return { status: 'parcial' };
        return { status: 'cumplido' };
      }
      if (prodPlans.length > 0) return { status: 'desvio' };
      return { status: 'sinPlan' };
    }

    function showDayModal(dateStr) {
      // Mostrar detalle de plan vs real para ese día
      const plansT1 = planData[key(dateStr,'T1')] || [];
      const plansT2 = planData[key(dateStr,'T2')] || [];
      const plansT3 = planData[key(dateStr,'T3')] || [];
      const realT1 = realDataByTurno[key(dateStr,'T1')] || [];
      const realT2 = realDataByTurno[key(dateStr,'T2')] || [];
      const realT3 = realDataByTurno[key(dateStr,'T3')] || [];
      
      let html = `<h3>Detalle del ${dateStr}</h3><table class="gantt-table"><tr><th>Turno</th><th>Planificado</th><th>Real</th><th>Estado</th></tr>`;
      const addRow = (turno, plans, reals) => {
        const planText = plans.map(p => `${p.moldeCompleto} (${p.tarea})`).join(', ') || '-';
        const realText = reals.join(', ') || '-';
        let estado = '-';
        if (reals.length > 0 && plans.length === 0) estado = '📌 Sin plan';
        else if (reals.length > 0) {
          const comp = getCompliance(reals[0], plans);
          estado = comp.status === 'cumplido' ? '✅ Cumplido' : comp.status === 'parcial' ? '⏳ Parcial' : '⚠️ Desvío';
        }
        html += `<tr><td>${turno}</td><td>${planText}</td><td>${realText}</td><td>${estado}</td></tr>`;
      };
      addRow('T1', plansT1, realT1);
      addRow('T2', plansT2, realT2);
      addRow('T3', plansT3, realT3);
      html += '</table>';
      
      const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
      const modal = document.createElement('div'); modal.className = 'modal-content';
      modal.innerHTML = `<button class="modal-close" onclick="this.parentElement.parentElement.remove()">✕</button>${html}`;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function renderResumen() { /* igual, usando las nuevas estructuras */ }

    function cambiarMes(delta) { currentDate.setMonth(currentDate.getMonth() + delta); loadData(); }
    function updateClock() { /* igual */ }

    window.addEventListener('load', () => {
      updateClock();
      setInterval(updateClock, 30000);
      loadData();
    });
  </script>
</body>
</html>
