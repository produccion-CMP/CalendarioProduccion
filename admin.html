<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso restringido</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; background: #f0f0f0; }
    .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
    input[type="password"] { padding: 10px; width: 200px; margin-bottom: 15px; }
    button { padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .error { color: red; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Área de planificación</h2>
    <p>Ingresá la contraseña para acceder a los datos</p>
    <input type="password" id="password" placeholder="Contraseña">
    <br>
    <button onclick="verificar()">Entrar</button>
    <div id="mensaje" class="error"></div>
  </div>

  <script>
    // ⚠️ CAMBIÁ esta contraseña por la que quieras
    const CONTRASENA = 'produccion2026';

    function verificar() {
      const ingreso = document.getElementById('password').value;
      if (ingreso === CONTRASENA) {
        // Redirigir a la hoja de Google Sheets en modo edición
        // Reemplazá con la URL de edición de TU archivo de Google Sheets
        window.location.href = 'https://docs.google.com/spreadsheets/d/1f3Vno40l_r_Ckx8y3k3CAzuCdmdSRaZandboFQrCqyk/edit?usp=sharing';
      } else {
        document.getElementById('mensaje').innerText = 'Contraseña incorrecta';
      }
    }
  </script>
</body>
</html>
