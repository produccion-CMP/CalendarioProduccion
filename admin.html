<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Planificación – Cerámica Marcos Paz</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #1a1814;
      --panel: #25221d;
      --border: #4a4238;
      --text: #f0e6d8;
      --accent: #d97736;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-box, .form-box {
      background: var(--panel);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    h2 { margin-top: 0; color: var(--accent); }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-weight: 500;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #c85d2a; }
    .error { color: #e53935; }
    .success { color: #4caf50; }
    .hidden { display: none; }
    a { color: var(--accent); text-decoration: none; display: block; margin-top: 15px; }
  </style>
</head>
<body>
  <!-- Pantalla de login -->
  <div id="loginScreen" class="login-box">
    <h2>🔐 Área Restringida</h2>
    <input type="password" id="passwordField" placeholder="Contraseña">
    <button onclick="checkPassword()">Ingresar</button>
    <div id="loginMsg" class="error"></div>
  </div>

  <!-- Formulario de carga -->
  <div id="formScreen" class="form-box hidden">
    <h2>🧱 Nueva Planificación</h2>
    <form id="planForm">
      <label>Molde:</label>
      <select id="moldeSelect" required></select>

      <label>Tarea:</label>
      <select id="tareaSelect" required>
        <option value="Producción">Producción</option>
        <option value="Prueba">Prueba</option>
      </select>

      <label>Fecha Inicio:</label>
      <input type="date" id="fechaInicio" required>

      <label>Turno Inicio:</label>
      <select id="turnoInicio">
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="T3">T3</option>
      </select>

      <label>Fecha Fin:</label>
      <input type="date" id="fechaFin" required>

      <label>Turno Fin:</label>
      <select id="turnoFin">
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="T3">T3</option>
      </select>

      <button type="submit">📤 Enviar Planificación</button>
    </form>
    <div id="formMsg"></div>
    <a href="index.html">← Volver al calendario</a>
  </div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/TU_SCRIPT_ID/exec';  // <-- REEMPLAZÁ
    const PASSWORD = 'Ladrillos2026';  // misma que en Apps Script

    function checkPassword() {
      if (document.getElementById('passwordField').value === PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('formScreen').classList.remove('hidden');
        loadMoldes();
      } else {
        document.getElementById('loginMsg').textContent = 'Contraseña incorrecta';
      }
    }

    async function loadMoldes() {
      const resp = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=0&single=true&output=csv');
      const csv = await resp.text();
      const data = Papa.parse(csv, { header: true }).data;
      const select = document.getElementById('moldeSelect');
      data.forEach(row => {
        const molde = row['Molde N°']?.trim();
        if (molde) {
          const opt = document.createElement('option');
          opt.value = molde;
          opt.textContent = molde;
          select.appendChild(opt);
        }
      });
    }

    document.getElementById('planForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const molde = document.getElementById('moldeSelect').value;
      const tarea = document.getElementById('tareaSelect').value;
      const fechaInicio = document.getElementById('fechaInicio').value;
      const turnoInicio = document.getElementById('turnoInicio').value;
      const fechaFin = document.getElementById('fechaFin').value;
      const turnoFin = document.getElementById('turnoFin').value;

      // Cálculo simple de duración
      const d1 = new Date(fechaInicio), d2 = new Date(fechaFin);
      const dias = Math.ceil((d2 - d1) / (1000*60*60*24)) + 1;
      const duracionDias = dias > 0 ? dias : 1;
      const duracionTurnos = duracionDias * 3; // aprox

      const params = new URLSearchParams({
        password: PASSWORD,
        molde, tarea, fechaInicio, turnoInicio, fechaFin, turnoFin,
        duracionDias, duracionTurnos
      });

      const msg = document.getElementById('formMsg');
      try {
        const res = await fetch(URL_SCRIPT, { method: 'POST', body: params });
        const json = await res.json();
        if (json.result === 'success') {
          msg.className = 'success';
          msg.textContent = '✅ Planificación guardada exitosamente.';
          document.getElementById('planForm').reset();
        } else {
          msg.className = 'error';
          msg.textContent = '❌ ' + json.message;
        }
      } catch (err) {
        msg.className = 'error';
        msg.textContent = '❌ Error de conexión con el servidor.';
      }
    });
  </script>
</body>
</html>
