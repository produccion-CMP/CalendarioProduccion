<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carga de Producción – Planta CEVIL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --bg-body: #0f0f0f;
            --bg-panel: #1c1c1e;
            --bg-cell: #2c2c2e;
            --border: #3a3a3c;
            --text-main: #f5f5f7;
            --text-muted: #98989d;
            --accent: #e07b4c;
            --accent-light: #f0a880;
            --radius: 16px;
            --font: 'Plus Jakarta Sans', system-ui, sans-serif;
            --shadow-3d: 0 8px 24px rgba(0,0,0,0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); background: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .wizard-container { background: var(--bg-panel); width: 100%; max-width: 500px; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow-3d); border: 1px solid var(--border); position: relative; overflow: hidden; }
        .step { display: none; animation: slideIn 0.3s ease forwards; }
        .step.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        h2 { color: var(--accent-light); font-weight: 800; font-size: 1.5rem; text-align: center; margin-bottom: 24px; }
        h3 { color: var(--text-main); font-weight: 700; font-size: 1.1rem; text-align: center; margin-bottom: 20px; }

        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn-grid.grid-2 { grid-template-columns: 1fr 1fr; }
        
        button.option-btn { background: var(--bg-cell); border: 2px solid var(--border); color: var(--text-main); padding: 16px; border-radius: 12px; font-family: var(--font); font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
        button.option-btn:hover { border-color: var(--accent); background: rgba(224, 123, 76, 0.1); transform: translateY(-2px); }
        button.option-btn img { width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); font-family: var(--font); font-weight: 600; font-size: 1rem; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: var(--accent); }

        button.primary-btn { background: var(--accent); border: none; color: #fff; width: 100%; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(224, 123, 76, 0.4); margin-top: 10px; }
        button.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(224, 123, 76, 0.6); }
        button.secondary-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 12px; transition: 0.2s; }
        button.secondary-btn:hover { color: var(--text-main); border-color: var(--text-main); }

        .header-status { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .loader { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .feedback { text-align: center; font-weight: 700; margin-top: 15px; }
        .feedback.error { color: #ff453a; }
        .feedback.success { color: #30d158; }
        
        #summaryText { background: var(--bg-body); padding: 12px; border-radius: 8px; font-size: 0.9rem; color: var(--accent-light); margin-bottom: 20px; text-align: center; border: 1px dashed var(--border); }
    </style>
</head>
<body>

    <div class="wizard-container">
        <!-- Loader Inicial -->
        <div id="step-loading" class="step active">
            <div class="loader"></div>
            <h3>Sincronizando base de datos...</h3>
        </div>

        <!-- Autenticación -->
        <div id="step-auth" class="step">
            <h2>🔐 Control de Acceso</h2>
            <div class="input-group">
                <input type="password" id="pwdInput" placeholder="Ingrese su contraseña">
            </div>
            <button class="primary-btn" onclick="verificarPassword()">Ingresar</button>
            <div id="authMsg" class="feedback error"></div>
            <a href="index.html" style="display:block; text-align:center; color:var(--accent); text-decoration:none; margin-top:20px; font-size:0.9rem;">← Volver al Cronograma</a>
        </div>

        <!-- 1. Tarea -->
        <div id="step-tarea" class="step">
            <div class="header-status">Paso 1 de 5 <span onclick="resetWizard()" style="cursor:pointer;">⟲ Reiniciar</span></div>
            <h2>Tipo de Asignación</h2>
            <div class="btn-grid">
                <button class="option-btn" onclick="selectTarea('Producción')">🏭 Producción</button>
                <button class="option-btn" onclick="selectTarea('Prueba')">🔬 Prueba</button>
            </div>
        </div>

        <!-- 2. Familia -->
        <div id="step-familia" class="step">
            <div class="header-status">Paso 2 de 5 <button class="secondary-btn" style="width:auto; padding:4px 8px; margin:0;" onclick="goBack('step-tarea')">Atrás</button></div>
            <h2>Seleccionar Familia</h2>
            <div id="familia-container" class="btn-grid grid-2"></div>
        </div>

        <!-- 3. Tipo de Ladrillo -->
        <div id="step-lad" class="step">
            <div class="header-status">Paso 3 de 5 <button class="secondary-btn" style="width:auto; padding:4px 8px; margin:0;" onclick="goBack('step-familia')">Atrás</button></div>
            <h2>Tipo de Ladrillo</h2>
            <div id="lad-container" class="btn-grid grid-2"></div>
        </div>

        <!-- 4. N° Molde -->
        <div id="step-num" class="step">
            <div class="header-status">Paso 4 de 5 <button class="secondary-btn" style="width:auto; padding:4px 8px; margin:0;" onclick="goBack('step-lad')">Atrás</button></div>
            <h2>Número de Molde</h2>
            <div id="num-container" class="btn-grid grid-2"></div>
        </div>

        <!-- 5. Fechas y Envío -->
        <div id="step-fechas" class="step">
            <div class="header-status">Paso 5 de 5 <button class="secondary-btn" style="width:auto; padding:4px 8px; margin:0;" onclick="goBack('step-num')">Atrás</button></div>
            <h2>Configurar Fechas</h2>
            <div id="summaryText"></div>
            
            <div class="input-group">
                <label>Fecha de Inicio</label>
                <input type="date" id="fInicio">
            </div>
            <div class="input-group">
                <label>Turno de Inicio</label>
                <select id="tInicio">
                    <option value="T1">Turno 1</option>
                    <option value="T2">Turno 2</option>
                    <option value="T3">Turno 3</option>
                </select>
            </div>

            <div id="bloque-fin">
                <div class="input-group">
                    <label>Fecha de Fin</label>
                    <input type="date" id="fFin">
                </div>
                <div class="input-group">
                    <label>Turno de Fin</label>
                    <select id="tFin">
                        <option value="T1">Turno 1</option>
                        <option value="T2">Turno 2</option>
                        <option value="T3">Turno 3</option>
                    </select>
                </div>
            </div>

            <button class="primary-btn" id="btnSubmit" onclick="enviarDatos()">📤 Confirmar Asignación</button>
            <div id="submitMsg" class="feedback"></div>
        </div>

    </div>

    <script>
        // =========================================================================
        // CONFIGURACIÓN (Reemplazar URL_SCRIPT con la URL generada en Apps Script)
        // =========================================================================
        const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbwAjJJAFBEoFsfmUMwr39qB9qI8EHAblwMItixZYul6blpw266f8Ho5Ilh26BSlNj_Jtg/exec'; 
        const CSV_MOLDES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSOrhCEi7WZWpvdA95aWRwbS0pPAqYfNBvNRi0ZHTjS1SR2dDS3B2EyXyuYda_w9xhHqObojm4t81B8/pub?gid=164840916&single=true&output=csv';
        const IMG_PATH = 'img/moldes/';
        const FALLBACK_IMG = 'img/moldes/default.png';

        // Estado global de la carga
        let db = {}; // Jerarquía: Familia -> Lad -> N° -> Molde completo
        let historyStack = [];
        let state = { tarea: '', familia: '', lad: '', num: '', moldeCompleto: '' };

        // Inicialización
        window.onload = async () => {
            try {
                const res = await fetch(CSV_MOLDES);
                const csv = await res.text();
                Papa.parse(csv, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        procesarDB(results.data);
                        showStep('step-auth');
                    }
                });
            } catch (e) {
                document.getElementById('step-loading').innerHTML = '<h3 style="color:#ff453a;">Error crítico: No se pudo conectar a la base de datos de moldes.</h3>';
            }
        };

        function procesarDB(data) {
            data.forEach(row => {
                const fam = row['Familia']?.trim();
                const lad = row['Lad']?.trim();
                const num = row['N°']?.trim();
                const molde = row['Molde']?.trim();
                if (!fam || !lad || !num || !molde) return;

                if (!db[fam]) db[fam] = {};
                if (!db[fam][lad]) db[fam][lad] = {};
                db[fam][lad][num] = molde;
            });
        }

        // Navegación
        function showStep(stepId, addHistory = true) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
            if (addHistory && stepId !== 'step-auth' && stepId !== 'step-loading') {
                if(historyStack[historyStack.length-1] !== stepId) historyStack.push(stepId);
            }
        }

        function goBack(targetStep) {
            historyStack.pop(); 
            showStep(targetStep, false);
        }

        function resetWizard() {
            state = { tarea: '', familia: '', lad: '', num: '', moldeCompleto: '' };
            historyStack = [];
            showStep('step-tarea');
        }

        // Lógica de Autenticación
        function verificarPassword() {
            const pwd = document.getElementById('pwdInput').value;
            if (pwd === 'Ladrillos2026') {
                showStep('step-tarea');
            } else {
                document.getElementById('authMsg').textContent = 'Acceso denegado. Contraseña incorrecta.';
            }
        }

        // Paso 1: Tarea
        function selectTarea(tarea) {
            state.tarea = tarea;
            renderFamilias();
            showStep('step-familia');
        }

        // Paso 2: Familia
        function renderFamilias() {
            const cont = document.getElementById('familia-container');
            cont.innerHTML = '';
            Object.keys(db).forEach(fam => {
                cont.innerHTML += `<button class="option-btn" onclick="selectFamilia('${fam}')">${fam}</button>`;
            });
        }

        function selectFamilia(fam) {
            state.familia = fam;
            const lads = Object.keys(db[fam]);
            if (lads.length === 1) {
                selectLad(lads[0], true); // Auto-skip
            } else {
                renderLads(lads);
                showStep('step-lad');
            }
        }

        // Paso 3: Ladrillo
        function renderLads(lads) {
            const cont = document.getElementById('lad-container');
            cont.innerHTML = '';
            lads.forEach(lad => {
                const img = `${IMG_PATH}${lad}.png`;
                cont.innerHTML += `<button class="option-btn" onclick="selectLad('${lad}', false)">
                    <img src="${img}" onerror="this.src='${FALLBACK_IMG}'">
                    ${lad}
                </button>`;
            });
        }

        function selectLad(lad, isAutoSkipped) {
            state.lad = lad;
            const nums = Object.keys(db[state.familia][lad]);
            if (nums.length === 1) {
                selectNum(nums[0], true); // Auto-skip
            } else {
                if (isAutoSkipped) historyStack.push('step-lad');
                renderNums(nums);
                showStep('step-num');
            }
        }

        // Paso 4: Número de Molde
        function renderNums(nums) {
            const cont = document.getElementById('num-container');
            cont.innerHTML = '';
            nums.forEach(num => {
                cont.innerHTML += `<button class="option-btn" onclick="selectNum('${num}', false)">Molde ${num}</button>`;
            });
        }

        function selectNum(num, isAutoSkipped) {
            state.num = num;
            state.moldeCompleto = db[state.familia][state.lad][num];
            if (isAutoSkipped) historyStack.push('step-num');
            prepararFechas();
            showStep('step-fechas');
        }

        // Paso 5: Fechas
        function prepararFechas() {
            document.getElementById('summaryText').innerHTML = `<strong>Molde:</strong> ${state.moldeCompleto} <br> <strong>Asignación:</strong> ${state.tarea}`;
            
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fInicio').value = hoy;
            document.getElementById('fFin').value = hoy;

            if (state.tarea === 'Prueba') {
                document.getElementById('bloque-fin').style.display = 'none';
            } else {
                document.getElementById('bloque-fin').style.display = 'block';
            }
        }

        // Envío POST
        async function enviarDatos() {
            const pwd = document.getElementById('pwdInput').value;
            const fi = document.getElementById('fInicio').value;
            const ti = document.getElementById('tInicio').value;
            
            if (!fi) {
                document.getElementById('submitMsg').className = 'feedback error';
                document.getElementById('submitMsg').textContent = 'Seleccione la fecha de inicio.';
                return;
            }

            const params = new URLSearchParams({
                password: pwd,
                molde: state.moldeCompleto,
                tarea: state.tarea,
                fechaInicio: fi,
                turnoInicio: ti,
                fechaFin: state.tarea === 'Prueba' ? fi : document.getElementById('fFin').value,
                turnoFin: state.tarea === 'Prueba' ? ti : document.getElementById('tFin').value
            });

            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('submitMsg');
            btn.disabled = true;
            btn.textContent = '⏳ Enviando...';
            msg.textContent = '';

            try {
                const res = await fetch(URL_SCRIPT, { method: 'POST', body: params });
                const json = await res.json();
                
                if (json.result === 'success') {
                    msg.className = 'feedback success';
                    msg.textContent = '✅ Planificación insertada en DatosProd exitosamente.';
                    setTimeout(resetWizard, 2500);
                } else {
                    msg.className = 'feedback error';
                    msg.textContent = '❌ Error: ' + json.message;
                }
            } catch (err) {
                msg.className = 'feedback error';
                msg.textContent = '❌ Error de comunicación con la base de datos (CORS o URL incorrecta).';
            } finally {
                btn.disabled = false;
                btn.textContent = '📤 Confirmar Asignación';
            }
        }
    </script>
</body>
</html>
