<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Planificación – Cerámica Marcos Paz</title>
  <style>
    :root {
      --terracota: #cc6b4b;
      --barro: #a0522d;
      --fondo: #fdf8f2;
      --texto: #4a3b32;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--fondo);
      color: var(--texto);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .contenedor {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    h1 {
      text-align: center;
      color: var(--barro);
      margin-bottom: 10px;
    }
    label {
      font-weight: 700;
      display: block;
      margin-top: 15px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background: var(--barro);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      font-weight: 700;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: #8b4513; }
    .oculto { display: none; }
    .error { color: red; font-weight: 700; margin-top: 10px; }
    .exito { color: green; font-weight: 700; margin-top: 10px; }
    #login-box { text-align: center; }
    #login-box input { width: auto; display: inline-block; }
  </style>
</head>
<body>
  <div class="contenedor" id="login-box">
    <h1>🔐 Acceso Restringido</h1>
    <p>Ingresá la clave para planificar</p>
    <input type="password" id="passwordInput" placeholder="Contraseña">
    <button onclick="verificarPassword()">Entrar</button>
    <div id="loginError" class="error"></div>
  </div>

  <div class="contenedor oculto" id="form-box">
    <h1>🧱 Nueva Planificación</h1>
    <form id="planForm">
      <label>Molde:</label>
      <select id="moldeSelect" required></select>

      <label>Tarea:</label>
      <select id="tareaSelect" required>
        <option value="Producción">Producción</option>
        <option value="Prueba">Prueba</option>
      </select>

      <label>Fecha Inicio:</label>
      <input type="date" id="fechaInicio" required>

      <label>Turno Inicio:</label>
      <select id="turnoInicio" required>
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="T3">T3</option>
      </select>

      <label>Fecha Fin:</label>
      <input type="date" id="fechaFin" required>

      <label>Turno Fin:</label>
      <select id="turnoFin" required>
        <option value="T1">T1</option>
        <option value="T2">T2</option>
        <option value="T3">T3</option>
      </select>

      <button type="submit">📤 Enviar Planificación</button>
      <div id="msgBox" class="exito"></div>
    </form>
    <a href="index.html" style="display:block; text-align:center; margin-top:15px; color:var(--barro);">← Volver al calendario</a>
  </div>

  <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/TU_SCRIPT_ID/exec'; // <-- REEMPLAZÁ
    const CONTRASENA = 'CeramicaMP2024';

    async function verificarPassword() {
      const pass = document.getElementById('passwordInput').value;
      if (pass === CONTRASENA) {
        document.getElementById('login-box').classList.add('oculto');
        document.getElementById('form-box').classList.remove('oculto');
        cargarMoldes();
      } else {
        document.getElementById('loginError').innerText = 'Contraseña incorrecta';
      }
    }

    async function cargarMoldes() {
      const resp = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vTQeQfWb0LQqub8pDTzEZv9SaQ7GBoQ12oJvde7C55CdWw9tL26JjLpJVEtXv8Ls02m1G36ztRgJg0W/pub?gid=0&single=true&output=csv');
      const csv = await resp.text();
      const data = Papa.parse(csv, { header: true }).data;
      const select = document.getElementById('moldeSelect');
      data.forEach(row => {
        const molde = row['Molde N°']?.trim();
        if (molde) {
          const opt = document.createElement('option');
          opt.value = molde;
          opt.innerText = molde;
          select.appendChild(opt);
        }
      });
    }

    document.getElementById('planForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const molde = document.getElementById('moldeSelect').value;
      const tarea = document.getElementById('tareaSelect').value;
      const fechaInicio = document.getElementById('fechaInicio').value;
      const turnoInicio = document.getElementById('turnoInicio').value;
      const fechaFin = document.getElementById('fechaFin').value;
      const turnoFin = document.getElementById('turnoFin').value;

      // Calcular duración en días
      const inicio = new Date(fechaInicio);
      const fin = new Date(fechaFin);
      const diffDias = Math.ceil((fin - inicio) / (1000 * 60 * 60 * 24)) + 1;
      const duracionDias = diffDias > 0 ? diffDias : 1;
      const duracionTurnos = duracionDias * 3; // aproximado

      const params = new URLSearchParams({
        password: CONTRASENA,
        molde, tarea, fechaInicio, turnoInicio, fechaFin, turnoFin,
        duracionDias, duracionTurnos
      });

      try {
        const response = await fetch(URL_SCRIPT, { method: 'POST', body: params });
        const result = await response.json();
        const msg = document.getElementById('msgBox');
        if (result.result === 'success') {
          msg.className = 'exito';
          msg.innerText = '✅ Planificación agregada exitosamente.';
          document.getElementById('planForm').reset();
        } else {
          msg.className = 'error';
          msg.innerText = '❌ Error: ' + result.message;
        }
      } catch (err) {
        document.getElementById('msgBox').className = 'error';
        document.getElementById('msgBox').innerText = '❌ Error de conexión.';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</body>
</html>
